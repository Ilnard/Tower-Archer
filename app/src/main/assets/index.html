<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Башенный лучник</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f2a44">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one portrait play-field canvas, HUD floating over the sky, parchment cards for menus. Single cartoon look by choice. */
:root{
  --ink:#1f2a44; --parch:#fbf0d6; --parch-2:#f1dfb6; --wood:#8a5a34; --wood-d:#5e3b1f;
  --gold:#f3c35f; --gold-d:#b5822f; --leaf:#4f8a3c; --danger:#c8463d; --mute:#6d6250;
  --display:'Russo One','Arial Black',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--ink);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:#7cc3e3}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--body);font-weight:900;cursor:pointer;border:0;color:var(--ink)}
[hidden]{display:none!important}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}

.hud{position:absolute;top:10px;left:0;right:0;display:flex;gap:8px;align-items:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pill{background:rgba(31,42,68,.86);color:#fff6df;border:2px solid var(--gold);border-radius:999px;padding:6px 12px;
  font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.wave{font-family:var(--display);font-weight:400;letter-spacing:.02em}
.hpbox{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.hpbar{flex:1;height:12px;border-radius:8px;background:rgba(31,42,68,.6);border:2px solid #fff6df;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(#ff8a72,var(--danger));transition:width .2s}
.hpnum{color:#fff;font-weight:900;font-size:13px;text-shadow:0 1px 2px #0008;font-variant-numeric:tabular-nums}
.iconbtn{pointer-events:auto;width:42px;height:42px;border-radius:50%;background:var(--gold);box-shadow:0 3px 0 var(--gold-d);font-size:18px;flex:none}

.bottom{position:absolute;left:0;right:0;bottom:12px;display:flex;justify-content:space-between;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{display:flex;gap:8px}
.skill{pointer-events:auto;position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;padding:0;overflow:hidden;
  background:radial-gradient(circle at 35% 30%,#4a5f8a,#1f2a44);border:3px solid var(--gold);box-shadow:0 3px 0 var(--gold-d),0 4px 12px #0005}
.skill::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(10,14,28,.72) calc(var(--p,0)*1turn),transparent 0)}
.skill .cdn{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:16px;z-index:1;text-shadow:0 1px 3px #000}
.skill.locked{filter:grayscale(1) brightness(.75);border-color:#9a8f7a;box-shadow:0 3px 0 #6b6252}
.skill.locked .cdn::before{content:"+";font-size:22px}
.skill.ready{animation:ready 1.6s ease-in-out infinite}
.skill.active{border-color:#fff;box-shadow:0 0 0 3px #ffd24a,0 0 18px #ffb43a}
.skill.camp{background:radial-gradient(circle at 35% 30%,#fff7e2,#f1dfb6);border-color:var(--wood);box-shadow:0 3px 0 var(--wood-d);font-size:22px;color:var(--wood-d)}
@keyframes ready{50%{box-shadow:0 3px 0 var(--gold-d),0 0 14px #ffd24a}}
.buymode{display:flex;gap:6px;align-items:center}
.buymode button{background:var(--parch-2);border-radius:10px;padding:6px 10px;font-size:13px}
.buymode button.on{background:var(--ink);color:var(--parch)}
.chip{pointer-events:auto;background:var(--parch);border:3px solid var(--wood);border-radius:14px;padding:9px 16px;font-size:15px;box-shadow:0 3px 0 var(--wood-d)}

.hint{position:absolute;left:0;right:0;top:64px;text-align:center;color:var(--ink);font-weight:900;font-size:15px;
  text-shadow:0 1px 0 #fff9;pointer-events:none;padding:0 24px;text-wrap:balance}

.overlay{position:absolute;inset:0;background:rgba(20,28,48,.72);display:flex;align-items:center;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:5}
.card{width:100%;max-height:100%;overflow:auto;background:var(--parch);border:4px solid var(--wood);border-radius:20px;
  padding:18px;box-shadow:0 6px 0 var(--wood-d),0 20px 40px #0006;display:flex;flex-direction:column;gap:12px}
.card h1,.card h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
.card h1{font-size:30px;color:var(--wood-d)}
.card h2{font-size:22px;color:var(--wood-d)}
.card p{margin:0;line-height:1.45}
.muted{color:var(--mute);font-size:14px}
.btn{background:var(--gold);border-radius:14px;padding:12px 16px;font-size:16px;box-shadow:0 3px 0 var(--gold-d)}
.btn.big{font-size:19px;padding:15px}
.btn.ghost{background:var(--parch-2);box-shadow:0 3px 0 #cbb68a}
.btn.ad{background:#7fd0a0;box-shadow:0 3px 0 #3f8a5d}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled),.chip:active,.iconbtn:active{transform:translateY(2px);box-shadow:none}
.stack{display:flex;flex-direction:column;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--parch-2);border-radius:10px;padding:6px 10px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:900;color:var(--mute)}
.waves{display:flex;flex-wrap:wrap;gap:6px}
.waves button{background:var(--parch-2);border-radius:10px;padding:7px 10px;font-size:14px;font-variant-numeric:tabular-nums}
.waves button.on{background:var(--ink);color:var(--parch)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tabs button{background:var(--parch-2);border-radius:10px;padding:9px 2px;font-size:13px}
.tabs button.on{background:var(--wood);color:var(--parch)}
.up{display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:2px dashed #dcc799}
.up b{font-size:16px}
.up .lv{font-size:12px;color:var(--mute);font-weight:900;margin-left:4px}
.up .d{grid-column:1;font-size:13px;color:var(--mute);line-height:1.35}
.up .btn{grid-row:1/3;grid-column:2;min-width:86px;padding:10px 12px;font-variant-numeric:tabular-nums}
.enemy-card{display:flex;gap:14px;align-items:center}
.enemy-card .big{width:84px;height:84px;flex:none;background:radial-gradient(#fff8e4,#ecd8a8);border-radius:18px;border:3px solid var(--wood)}
.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.12em;margin-right:.3em;background:radial-gradient(circle at 35% 30%,#fff3a8,#f3c35f 45%,#c27f1c);box-shadow:inset 0 0 0 1.5px #8a5a14}
details{background:var(--parch-2);border-radius:12px;padding:8px 12px}
details summary{font-weight:900;cursor:pointer}
details .stack{margin-top:8px}
#ad{position:absolute;inset:0;z-index:9;background:#10141f;color:#e8ecf5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
#ad .t{font-family:var(--display);font-size:26px}
#ad .n{font-size:64px;font-family:var(--display)}
@media (prefers-reduced-motion:reduce){.hpbar i{transition:none}.skill.ready{animation:none}}
</style>

</head><body>
<div id="app">
  <canvas id="game" aria-label="Игровое поле"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="pill wave" id="hWave">Волна 1</div>
    <div class="pill" id="hCoins"><i class="coin"></i>0</div>
    <div class="hpbox"><div class="hpbar"><i id="hHp"></i></div><span class="hpnum" id="hHpN">5/5</span></div>
    <button class="iconbtn" id="bPause" aria-label="Пауза">❚❚</button>
  </div>
  <div class="hint" id="hint" hidden>Коснись поля и веди палец к цели. Отпусти — выстрел.</div>
  <div class="bottom" id="bottom" hidden><div class="side"><button class="skill" id="sk-meteor" aria-label="Метеоритный дождь"><svg viewBox="0 0 32 32" width="26" height="26"><path d="M4 4l12 9M8 2l10 9M2 9l11 7" stroke="#ffb04a" stroke-width="3" stroke-linecap="round"/><circle cx="21" cy="20" r="8" fill="#ff7a2e" stroke="#2b1d2c" stroke-width="2"/><circle cx="18.5" cy="17.5" r="2.5" fill="#ffd25a"/></svg><span class="cdn"></span></button><button class="skill" id="sk-rage" aria-label="Быстрая перезарядка"><svg viewBox="0 0 32 32" width="26" height="26"><path d="M18 2L6 18h8l-3 12 13-17h-8z" fill="#ffd24a" stroke="#2b1d2c" stroke-width="2" stroke-linejoin="round"/></svg><span class="cdn"></span></button></div><div class="side"><button class="skill" id="sk-frost" aria-label="Ледяная буря"><svg viewBox="0 0 32 32" width="26" height="26"><g stroke="#e6f7ff" stroke-width="3" stroke-linecap="round"><path d="M16 3v26M4.7 9.5l22.6 13M4.7 22.5l22.6-13"/><path d="M12 5l4 3 4-3M12 27l4-3 4 3" fill="none"/></g><circle cx="16" cy="16" r="3" fill="#8fe3ff"/></svg><span class="cdn"></span></button><button class="skill camp" id="bCamp" aria-label="Лагерь">⚒</button></div></div>
  <div class="overlay" id="ov"><div class="card" id="card"></div></div>
  <div id="ad" hidden></div>
</div>

<script>
'use strict';
/* =====================================================================
   АРХИТЕКТУРА (как в будущем Godot-проекте):
   BAL / ENEMIES / UPGRADES — таблицы данных (→ Resource .tres)
   WaveGen   — процедурный генератор волн
   Progress  — вычисление характеристик из уровней улучшений
   Store     — локальное сохранение с версией схемы
   Ads       — адаптер рекламы (здесь заглушка, в Android → Yandex Mobile Ads)
   Game/Render/Input/UI — игровая сцена и экраны
   ===================================================================== */

/* ---------- ТАБЛИЦА БАЛАНСА ----------
   Бесконечная прогрессия. Здоровье врагов и награды растут геометрически по фазам:
   до 100-й волны награды почти поспевают за ценами (лёгкий старт), дальше рост HP
   ускоряется, а наград — замедляется, и прохождение требует всё больше прокачки.
   Модель экономики (work/econ2.py): ~1 ч до 100-й волны, ~2 ч до 200-й, ~5 ч до 300-й,
   десятки часов до 400-й и 100+ ч до 500-й при оптимальной прокачке. */
const PHASES = [            // [до волны, рост HP за волну, рост награды за волну]
  [100,      1.035, 1.019],
  [250,      1.060, 1.006],
  [500,      1.065, 1.006],
  [Infinity, 1.070, 1.006],
];
function phased(w, idx) {
  let v = 1, prev = 1;
  for (const p of PHASES) { const span = Math.max(0, Math.min(w, p[0]) - prev); v *= p[idx] ** span; prev = p[0]; if (w <= p[0]) break; }
  return v;
}
const BAL = {
  tower:  { baseHp: 5 },
  arrow:  { speed: 680, baseDamage: 2, cooldown: 0.45, minCooldown: 0.12, volleyN: 5, spread: 0.13 },
  wave: {
    count:      w => Math.min(40, 6 + Math.floor(w * 0.5)),
    hp:         w => phased(w, 1),
    speed:      w => 1 + Math.min(w, 300) * 0.0025,
    interval:   w => Math.max(0.33, 1.05 - w * 0.004),
    reward:     w => phased(w, 2),
    clearBonus: w => Math.max(3, Math.round(BAL.wave.count(w) * BAL.wave.reward(w) * 0.6)),
    breakTime: 2.4,
  },
  // После 500-й волны новых врагов нет: каждые 50 волн растут способности известных
  postCap: { start: 500, every: 50, cdMult: 0.94, potencyAdd: 0.12 },
};

/* ---------- ВРАГИ: открытие на 1/3/6 (база), 10..50, далее каждые 50 до 500 ----------
   Способности — компоненты: armor, heal, split, blink, ranged, regen, phase, summon, charge, zigzag */
const ENEMIES = [
  { id:'goblin',  name:'Гоблин',   emoji:'👺', unlock:1,   hp:2,   speed:34, size:30, reward:1, dmg:1, weight:10,
    desc:'Обычный пехотинец.', counter:'Любой меткий выстрел.' },
  { id:'wolf',    name:'Волк',     emoji:'🐺', unlock:3,   hp:1.5, speed:64, size:30, reward:1, dmg:1, weight:7,
    desc:'Быстрый, но хрупкий.', counter:'Стреляй на упреждение.' },
  { id:'ogre',    name:'Огр',      emoji:'👹', unlock:6,   hp:7,   speed:21, size:40, reward:3, dmg:2, weight:4,
    desc:'Медленный и толстокожий, бьёт стену вдвое сильнее.', counter:'Урон и пробитие.' },
  { id:'knight',  name:'Рыцарь',   emoji:'🤺', unlock:10,  hp:4,   speed:28, size:34, reward:3, dmg:1, weight:5, ab:{ armor:2 },
    desc:'Серые щитки над головой: каждый поглощает одно попадание.', counter:'Залп сбивает броню сразу; стальные стрелы её игнорируют.' },
  { id:'shaman',  name:'Шаман',    emoji:'🧙', unlock:20,  hp:4,   speed:24, size:34, reward:4, dmg:1, weight:4, ab:{ heal:{ every:3.2, radius:95, pct:0.3 } },
    desc:'Зелёное кольцо — скоро вылечит соседей.', counter:'Убей его первым.' },
  { id:'slime',   name:'Слизень',  emoji:'🦠', unlock:30,  hp:5,   speed:26, size:36, reward:3, dmg:1, weight:4, ab:{ split:{ n:2 } },
    desc:'При гибели делится на двух малышей.', counter:'Взрывные стрелы и веер.' },
  { id:'phantom', name:'Фантом',   emoji:'👻', unlock:40,  hp:3,   speed:36, size:32, reward:4, dmg:1, weight:4, ab:{ blink:{ cd:2.6, dist:72 } },
    desc:'Фиолетовое мерцание — уклонится от летящей стрелы.', counter:'Залп или второй выстрел сразу после рывка.' },
  { id:'scorp',   name:'Скорпион', emoji:'🦂', unlock:50,  hp:5,   speed:30, size:34, reward:5, dmg:1, weight:4, ab:{ ranged:{ stopAt:0.5, every:2.8, dmg:1 } },
    desc:'Останавливается и плюёт ядом в башню. Оранжевое свечение — замах.', counter:'Плевки можно сбить стрелой.' },
  { id:'ape',     name:'Тролль',   emoji:'🦍', unlock:100, hp:14,  speed:20, size:44, reward:8, dmg:2, weight:3, ab:{ armor:2, regen:0.06 },
    desc:'Броня и регенерация.', counter:'Короткий мощный натиск без пауз.' },
  { id:'eye',     name:'Око',      emoji:'👁️', unlock:150, hp:6,   speed:30, size:34, reward:6, dmg:1, weight:3, ab:{ phase:{ on:1.6, off:1.1 } },
    desc:'Становится прозрачным и неуязвимым; мерцает перед этим.', counter:'Стреляй, когда оно плотное.' },
  { id:'necro',   name:'Некромант',emoji:'💀', unlock:200, hp:8,   speed:22, size:36, reward:8, dmg:1, weight:3, ab:{ summon:{ every:4.2, n:2, id:'goblin' } },
    desc:'Тёмный круг — призывает гоблинов.', counter:'Приоритетная цель.' },
  { id:'boar',    name:'Вепрь',    emoji:'🐗', unlock:250, hp:9,   speed:26, size:38, reward:7, dmg:2, weight:3, ab:{ charge:{ every:3, wind:0.7, dur:0.6, mult:4.5 } },
    desc:'Красный «!» — замирает и делает рывок.', counter:'Стреляй во время замаха.' },
  { id:'bats',    name:'Рой',      emoji:'🦇', unlock:300, hp:3,   speed:46, size:30, reward:5, dmg:1, weight:3, ab:{ zigzag:{ amp:55, freq:3 }, split:{ n:2 } },
    desc:'Петляет и распадается на двоих.', counter:'Широкий веер.' },
  { id:'golem',   name:'Голем',    emoji:'🗿', unlock:350, hp:22,  speed:16, size:46, reward:12,dmg:3, weight:2, ab:{ armor:4, split:{ n:2 } },
    desc:'Тяжёлая броня, распадается на обломки.', counter:'Стальные стрелы и пробитие.' },
  { id:'drake',   name:'Дракончик',emoji:'🐉', unlock:400, hp:10,  speed:30, size:40, reward:10,dmg:2, weight:2, ab:{ zigzag:{ amp:45, freq:1.6 }, ranged:{ stopAt:0.42, every:2.4, dmg:1 } },
    desc:'Летает зигзагом и плюётся огнём.', counter:'Сбивай снаряды, добивай залпом.' },
  { id:'lich',    name:'Лич',      emoji:'☠️', unlock:450, hp:12,  speed:20, size:38, reward:12,dmg:2, weight:2, ab:{ summon:{ every:5, n:2, id:'wolf' }, phase:{ on:2, off:1 } },
    desc:'Призывает волков и уходит в тень.', counter:'Бей в окно видимости.' },
  { id:'demon',   name:'Демон',    emoji:'😈', unlock:500, hp:30,  speed:18, size:50, reward:25,dmg:4, weight:1, ab:{ armor:3, heal:{ every:4, radius:110, pct:0.25 }, blink:{ cd:3.5, dist:80 } },
    desc:'Последний архетип: броня, лечение, уклонение.', counter:'Всё сразу: сталь, залп, огонь.' },
];
const ENEMY = Object.fromEntries(ENEMIES.map(e => [e.id, e]));

/* ---------- УЛУЧШЕНИЯ: без потолка, рост в процентах, цена растёт геометрически ---------- */
const ARROW_TYPES = ['Деревянная', 'Стальная', 'Ледяная', 'Взрывная'];
const pct = x => (x >= 10 ? '×' + fmt(x) : '+' + fmt(Math.round((x - 1) * 1000) / 10) + '%');
const UPGRADES = {
  character: { title:'Персонаж', items:[
    { id:'hp',     name:'Крепкие стены',   cost:l => 30 * 1.22 ** l,
      fx:l => `Здоровье башни ${Progress.maxHp(l)}` },
    { id:'repair', name:'Каменщик',        cost:l => 60 * 1.3 ** l,
      fx:l => l ? `После волны чинит ${l} ❤` : 'Не изучено: башня не чинится между волнами' },
    { id:'reload', name:'Быстрая тетива',  cost:l => 20 * 1.18 ** l,
      fx:l => { const r = Progress.rate(l); return r.over > 1 ? `Предел скорости; сверх него урон ${pct(r.over)}` : `Скорость стрельбы ${pct(1.05 ** l)}`; } },
  ]},
  talents: { title:'Таланты', items:[
    { id:'volley', name:'Пятистрельный залп', cost:l => 25 * 1.17 ** l,
      fx:l => { const v = Progress.volley(l); return `Шанс ${Math.round(v.chance * 100)}%` + (v.dmg > 1 ? `, урон залпа ${pct(v.dmg)}` : ''); } },
    { id:'fire',   name:'Огненные наконечники', cost:l => 40 * 1.18 ** l,
      fx:l => { const f = Progress.fire(l); return l ? `Поджог ${Math.round(f.chance * 100)}%, горение ${Math.round(f.dps * 100)}% урона/с` : 'Не изучено'; } },
    { id:'loot',   name:'Добыча',           cost:l => 60 * 1.25 ** l,
      fx:l => `Монеты за врагов ${pct(1.03 ** l)}` },
  ]},
  weapon: { title:'Оружие', items:[
    { id:'damage', name:'Наконечник',       cost:l => 15 * 1.17 ** l,
      fx:l => `Урон стрелы ${fmt(Progress.damage(l))}` },
    { id:'pierce', name:'Пробитие',         cost:l => 500 * 4 ** l,
      fx:l => l ? `Сквозь ${l} ${l % 10 === 1 && l % 100 !== 11 ? 'врага' : 'врагов'}` : 'Стрела останавливается на первом враге' },
    { id:'type',   name:'Тип стрелы',       cost:l => l < 3 ? [150, 600, 2500][l] : 2500 * 1.3 ** (l - 2),
      fx:l => l <= 3 ? ARROW_TYPES[l] + ['', ': пробивает броню', ': броня и замедление', ': броня, замедление и взрыв'][l]
                    : `Взрывная: взрыв ${Math.round(Progress.splash(l) * 100)}% урона` },
  ]},
  skills: { title:'Навыки', items:[

/* ---------- ПРОГРЕСС: характеристики из уровней ---------- */
const Progress = {
  maxHp:  l => BAL.tower.baseHp + l,
  damage: l => BAL.arrow.baseDamage * 1.1 ** l,
  rate(l) { const m = 1.05 ** l, cd = BAL.arrow.cooldown / m; return { cd:Math.max(BAL.arrow.minCooldown, cd), over:Math.max(1, BAL.arrow.minCooldown / cd) }; },
  volley(l) { const cap = 21; return { chance:Math.min(.5, .08 + .02 * l), dmg:1.04 ** Math.max(0, l - cap) }; },
  fire(l)   { return { chance:Math.min(.5, .1 * l), dps:l ? .35 * 1.05 ** (l - 1) : 0 }; },
  splash(l) { return .5 * 1.05 ** Math.max(0, l - 3); },
  meteor(l) { return { n:Math.min(12, 4 + Math.floor((l - 1) / 4)), mult:1.08 ** (l - 1), cd:Math.max(15, 30 * .98 ** (l - 1)) }; },
  rage(l)   { return { dur:Math.min(10, 5 + .25 * (l - 1)), mult:1.05 ** (l - 1), cd:Math.max(20, 40 * .98 ** (l - 1)) }; },
  frost(l)  { return { dur:Math.min(10, 5 + .2 * (l - 1)), slow:Math.min(.8, .5 + .02 * (l - 1)), mult:1.05 ** (l - 1), cd:Math.max(18, 35 * .98 ** (l - 1)) }; },
  stats(u) {
    const r = this.rate(u.reload), v = this.volley(u.volley), f = this.fire(u.fire);
    return {
      maxHp: this.maxHp(u.hp), repair: u.repair, cooldown: r.cd,
      damage: this.damage(u.damage) * r.over, volley: v.chance, volleyDmg: v.dmg, spread: BAL.arrow.spread,
      fire: f.chance, burn: f.dps, pierce: u.pierce, arrowType: Math.min(3, u.type), splash: this.splash(u.type),
      loot: 1.03 ** u.loot,
      meteor: u.meteor ? this.meteor(u.meteor) : null, rage: u.rage ? this.rage(u.rage) : null, frost: u.frost ? this.frost(u.frost) : null,
    };
  },
};

/* ---------- СОХРАНЕНИЕ с версией схемы ---------- */
const Store = {
  KEY: 'tower-archer-save', SCHEMA: 2,
  fresh() { return { v:2, coins:0, best:0, sound:true, fx:'high', ups:Object.fromEntries(ALL_UPS.map(u => [u.id, 0])) }; },
  migrate(d) {
    const f = this.fresh();
    if (!d || typeof d !== 'object') return f;
    const ups = { ...(d.ups || {}) };
    if ((d.v || 1) < 2) {
      // v1 → v2: крит и ширина веера убраны — потраченные монеты возвращаются; урон стал процентным
      let refund = 0;
      for (let l = 0; l < (ups.crit || 0); l++) refund += Math.round(18 * 1.38 ** l);
      for (let l = 0; l < (ups.fan || 0); l++) refund += Math.round(30 * 1.6 ** l);
      d.coins = (d.coins || 0) + refund; delete ups.crit; delete ups.fan;
    }
    const out = { ...f, ...d, ups:{ ...f.ups }, v:this.SCHEMA };
    for (const k in f.ups) if (Number.isFinite(ups[k])) out.ups[k] = ups[k];
    return out;
  },
  load() { try { return this.migrate(JSON.parse(localStorage.getItem(this.KEY))); } catch { return this.fresh(); } },
  save(d) { try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch {} },
};

/* ---------- формат больших чисел: 1.2K, 3.4M, 5.6B, 7.8T, 9.1aa … ---------- */
const SUFFIX = ['', 'K', 'M', 'B', 'T'];
function fmt(n) {
  if (!Number.isFinite(n)) return '∞';
  const a = Math.abs(n);
  if (a < 10) return (Math.round(n * 10) / 10).toString();
  if (a < 1000) return Math.round(n).toString();
  const e = Math.floor(Math.log10(a) / 3);
  const s = e < SUFFIX.length ? SUFFIX[e] : String.fromCharCode(97 + Math.floor((e - 5) / 26)) + String.fromCharCode(97 + (e - 5) % 26);
  const v = n / 1000 ** e;
  return (v >= 100 ? Math.round(v) : v >= 10 ? Math.round(v * 10) / 10 : Math.round(v * 100) / 100) + s;
}

/* ---------- ГЕНЕРАТОР ВОЛН ---------- */
const WaveGen = {
  scale(w) {
    const B = BAL.wave, P = BAL.postCap;
    let hp = B.hp(w), speed = B.speed(w), tier = 0;
    if (w >= P.start + P.every) tier = Math.floor((w - P.start) / P.every);
    return { hp, speed, tier, cd: P.cdMult ** tier, pot: 1 + P.potencyAdd * tier, armorBonus: Math.floor(tier / 2) };
  },
  pool(w) { return ENEMIES.filter(e => e.unlock <= w); },
  newAt(w) { return ENEMIES.find(e => e.unlock === w && e.unlock >= 10) || null; },
  build(w) {
    const pool = this.pool(w), newest = pool[pool.length - 1], q = [];
    const fresh = ENEMIES.find(e => e.unlock === w);
    if (fresh) for (let i = 0; i < 3; i++) q.push(fresh.id);
    const weight = e => e.weight * (e === newest && w - e.unlock < 50 ? 1.6 : 1) * (e.unlock < 10 && w > 60 ? 0.5 : 1);
    const total = pool.reduce((s, e) => s + weight(e), 0), n = BAL.wave.count(w);
    while (q.length < n) {
      let r = Math.random() * total;
      for (const e of pool) { r -= weight(e); if (r <= 0) { q.push(e.id); break; } }
    }
    for (let i = q.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [q[i], q[j]] = [q[j], q[i]]; }
    return q;
  },
};

const clampX = x => Math.max(20, Math.min(W - 20, x));

/* ---------- обновление ---------- */
function update(dt) {
  time += dt;

  const R = run;
  R.banner = Math.max(0, R.banner - dt);
  if (R.inBreak) { R.breakT -= dt; if (R.breakT <= 0) startWave(); }
  else if (R.queue.length) { R.spawnT -= dt; if (R.spawnT <= 0) { spawnFromQueue(); R.spawnT = BAL.wave.interval(R.wave); } }

  R.cd -= dt; R.recoil -= dt; R.hurt = Math.max(0, R.hurt - dt);
  updateSkills(dt);
  if (R.rageT > 0 && drag && R.cd <= 0) fire(aimAngle(drag.x, drag.y));
  const frostMul = R.frostT > 0 && S.frost ? 1 - S.frost.slow : 1;
  if (R.pending !== null && R.cd <= 0) { fire(R.pending); R.pending = null; }

  // враги
  const n = R.enemies.length;
  for (let i = 0; i < n; i++) {
    const e = R.enemies[i]; if (e.dead) continue; const ab = e.ab, sc = e.sc;
    e.age += dt; e.slowT -= dt; e.blinkCd -= dt; e.flash -= dt;
    if (e.burnT > 0) { e.burnT -= dt; e.hp -= e.burnDps * dt; if (Math.random() < dt * 14) addFx({ k:'ember', x:e.x + (Math.random() - .5) * e.size * .6, y:e.y, vx:(Math.random() - .5) * 20, vy:-50 - Math.random() * 40, life:.5, max:.5, r:3 + Math.random() * 2, color:Math.random() < .5 ? '#ff8a2e' : '#ffd25a' }); if (e.hp <= 0) { kill(e); continue; } }
    if (ab.regen) e.hp = Math.min(e.max, e.hp + e.max * ab.regen * sc.pot * dt);

    if (ab.heal) { e.healT -= dt; if (e.healT <= 0) { e.healT = ab.heal.every * sc.cd;
      for (const o of R.enemies) if (o !== e && !o.dead && Math.hypot(o.x - e.x, o.y - e.y) < ab.heal.radius) { const h = o.max * ab.heal.pct * sc.pot; o.hp = Math.min(o.max, o.hp + h); for (let q = 0; q < 4; q++) addFx({ k:'heal', x:o.x + (Math.random() - .5) * o.size, y:o.y, vx:0, vy:-40 - Math.random() * 30, life:.7, max:.7, r:3, color:'#8dff9a' }); }
      ring(e.x, e.y, 'rgba(120,255,150,.9)', 6, ab.heal.radius, .45, 4); burst(e.x, e.y, '#8dff9a', 10, 140); } }

      smoke(e.x, e.y + 10, 8, '120,80,160'); ring(e.x, e.y + 10, 'rgba(200,120,255,.9)', 6, 50, .4, 4); } }
    let mul = (e.slowT > 0 ? 0.55 : 1) * frostMul;

        R.shots.push({ x:e.x, y:e.y, vx:(tx - e.x) / d * v, vy:(ty - e.y) / d * v, dmg:ab.ranged.dmg, dead:false, color:e.t.id === 'drake' ? '#ff7a2f' : '#9be05a' }); burst(e.x, e.y + e.size * .2, e.t.id === 'drake' ? '#ff9a4a' : '#b5ff6a', 6, 90); }

        addFx({ k:'ghost', x:e.x, y:e.y, spr:getSprite(e.t.id, e.size, 0, false), life:.35, max:.35 }); burst(e.x, e.y, '#c9a2ff', 10, 120);

    if (s.y >= L.wallY - 30) { s.dead = true; hurtTower(s.dmg); burst(s.x, s.y, s.color, 12, 140); ring(s.x, s.y, s.color, 4, 30, .3, 4); } }

  if (pull) { g.fillStyle = '#7a4a22'; g.fillRect(-pull, -1.5, 34, 3); g.fillStyle = '#e8e1cc'; g.beginPath(); g.moveTo(-pull + 38, 0); g.lineTo(-pull + 30, -4); g.lineTo(-pull + 30, 4); g.fill(); }
  g.restore();
  if (run && run.cd > 0) { g.strokeStyle = 'rgba(255,255,255,.85)'; g.lineWidth = 3; g.lineCap = 'round'; g.beginPath(); g.arc(x, y, 32, -Math.PI / 2, -Math.PI / 2 + TAU * (1 - run.cd / S.cooldown)); g.stroke(); }
}
function drawFx() {
  for (const p of run.fx) {
    const k = Math.max(0, p.life / p.max);
    if (p.k === 'spark') { ctx.globalCompositeOperation = 'lighter'; ctx.strokeStyle = p.color; ctx.globalAlpha = k; ctx.lineWidth = p.r; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * .04, p.y - p.vy * .04); ctx.stroke(); }
    else if (p.k === 'smoke') { ctx.globalAlpha = k * .7; ctx.fillStyle = `rgb(${p.color})`; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0, p.r), 0, TAU); ctx.fill(); }
    else if (p.k === 'ring') { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = k; ctx.strokeStyle = p.color; ctx.lineWidth = p.w * k + .5;
      ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0, p.r1 + (p.r0 - p.r1) * k), 0, TAU); ctx.stroke(); }
    else if (p.k === 'ember' || p.k === 'heal') { ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = k; ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0, p.r * (.5 + k * .5)), 0, TAU); ctx.fill(); }
    else if (p.k === 'ice') { ctx.globalAlpha = k; ctx.fillStyle = '#c9f1ff'; ctx.beginPath(); ctx.moveTo(p.x, p.y - 4); ctx.lineTo(p.x + 3, p.y); ctx.lineTo(p.x, p.y + 4); ctx.lineTo(p.x - 3, p.y); ctx.fill(); }
    else if (p.k === 'ghost') { ctx.globalAlpha = k * .5; blit(p.spr, p.x, p.y); }
    else if (p.k === 'coin') { ctx.globalAlpha = Math.min(1, k * 4); const sx = Math.abs(Math.cos(time * 12 + p.x0)) * .8 + .2;
      ctx.save(); ctx.translate(p.x, p.y); ctx.scale(sx, 1); ell(ctx, 0, 0, 6, 6, rgrad(ctx, 0, 0, 6, '#fff3a8', '#d08a1e'), 1.5); ctx.restore(); }
    ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  }
}
function drawTexts() {
  ctx.textAlign = 'center'; ctx.lineJoin = 'round';
  for (const t of run.texts) {
    const age = t.max - t.life, pop = age < .12 ? 1 + (.12 - age) / .12 * .6 : 1;
    ctx.globalAlpha = Math.min(1, t.life * 2.5); ctx.font = `900 ${Math.round(t.size * pop)}px Nunito, system-ui, sans-serif`;
    ctx.lineWidth = 4.5; ctx.strokeStyle = 'rgba(31,26,44,.9)'; ctx.strokeText(t.txt, t.x, t.y); ctx.fillStyle = t.color; ctx.fillText(t.txt, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}
function drawBanner() {
  if (!(run.banner > 0 || run.inBreak)) return;
  const a = run.inBreak ? 1 : Math.min(1, run.banner), cy = H * .28, w = Math.min(W - 60, 250), h = 46, x = W / 2 - w / 2;
  ctx.globalAlpha = a;
  for (const s of [-1, 1]) { const ex = s < 0 ? x - 18 : x + w + 18; poly(ctx, [ex, cy - h / 2 + 8, s < 0 ? x + 6 : x + w - 6, cy - h / 2 + 8, s < 0 ? x + 6 : x + w - 6, cy + h / 2 + 8, ex, cy + h / 2 + 8, ex + s * -10, cy + 8], '#7a2f2a', 2.5); }
  const gr = ctx.createLinearGradient(0, cy - h / 2, 0, cy + h / 2); gr.addColorStop(0, '#e2574c'); gr.addColorStop(1, '#a92e2a');
  poly(ctx, [x, cy - h / 2, x + w, cy - h / 2, x + w, cy + h / 2, x, cy + h / 2], gr, 3);
  ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(x + 3, cy - h / 2 + 3, w - 6, 6);
  ctx.textAlign = 'center'; ctx.font = '400 26px "Russo One", system-ui, sans-serif'; ctx.lineWidth = 5; ctx.strokeStyle = '#4a1414'; ctx.lineJoin = 'round';
  ctx.strokeText(`ВОЛНА ${run.wave}`, W / 2, cy + 9); ctx.fillStyle = '#fff3d6'; ctx.fillText(`ВОЛНА ${run.wave}`, W / 2, cy + 9);
  if (run.inBreak) { ctx.font = '800 14px Nunito, system-ui, sans-serif'; ctx.lineWidth = 4; ctx.strokeStyle = 'rgba(31,26,44,.85)';
    const sub = `${BAL.wave.count(run.wave)} врагов · через ${Math.ceil(run.breakT)}`; ctx.strokeText(sub, W / 2, cy + h / 2 + 30); ctx.fillStyle = '#fff'; ctx.fillText(sub, W / 2, cy + h / 2 + 30); }
  ctx.globalAlpha = 1;
}

/* ---------- цикл ---------- */
let last = 0;
function frame(t) {
  const dt = Math.min(0.04, (t - last) / 1000 || 0); last = t;
  shake = Math.max(0, shake - dt);
  update(dt); render(); requestAnimationFrame(frame);
}

/* ---------- ввод (один палец) ---------- */
function pt(e) { const r = cvs.getBoundingClientRect(); return { x:e.clientX - r.left, y:e.clientY - r.top }; }
cvs.addEventListener('pointerdown', e => {
  if (state !== 'play') return; drag = pt(e); try { cvs.setPointerCapture(e.pointerId); } catch {}
});
cvs.addEventListener('pointermove', e => { if (drag) drag = pt(e); });
cvs.addEventListener('pointerup', e => {
  if (!drag) return; const p = pt(e); drag = null; if (state !== 'play') return;
  const a = archerPos(); if (Math.hypot(p.x - a.x, p.y - a.y) < 20) return;
  const ang = aimAngle(p.x, p.y);
  if (run.cd <= 0) fire(ang); else run.pending = ang;
});
cvs.addEventListener('pointercancel', () => drag = null);

/* =====================================================================
   ИНТЕРФЕЙС
   ===================================================================== */
const hudCache = {};
function updateHud(force) {
  if (!run) return;
  const set = (k, v, fn) => { if (force || hudCache[k] !== v) { hudCache[k] = v; fn(v); } };
  set('w', run.wave, v => $('#hWave').textContent = 'Волна ' + v);
  set('c', fmt(save.coins), v => $('#hCoins').innerHTML = '<i class="coin"></i>' + v);
  updateSkillButtons();
  set('h', run.hp + '/' + S.maxHp, v => { $('#hHpN').textContent = v; $('#hHp').style.width = (100 * run.hp / S.maxHp) + '%'; });
}
function showGameUI(on) { $('#hud').hidden = !on; $('#bottom').hidden = !on; $('#hint').hidden = !(on && hintShown); }
function openOverlay(html) { $('#card').innerHTML = html; $('#ov').hidden = false; $('#card').scrollTop = 0; }
function closeOverlay() { $('#ov').hidden = true; }
function on(id, fn) { const el = document.getElementById(id); if (el) el.onclick = fn; }

function checkpoints() { const out = [1], top = Math.floor(save.best / 10) * 10; for (let w = 100; w < top - 40; w += 100) out.push(w); for (let w = Math.max(10, top - 40); w <= top; w += 10) if (!out.includes(w)) out.push(w); return out; }
let chosenStart = 1, testOpen = false, resetArm = false;

function menu() {
  state = 'menu'; showGameUI(false); run = null;
  const cps = checkpoints(); if (!cps.includes(chosenStart) && !testOpen) chosenStart = 1;
  const testWaves = [1, 10, 20, 30, 40, 50, 100, 150, 200, 250, 300, 350, 400, 450, 500, 600, 800, 1000];
  openOverlay(`
    <div class="label">Прототип · сборка 0.4</div>
    <h1>Башенный лучник</h1>
    <p class="muted">Защищай башню: веди пальцем к цели и отпускай. Иногда лук выпускает веер из пяти стрел.</p>
    <div class="stats"><span class="stat"><i class="coin"></i>${fmt(save.coins)}</span><span class="stat">Рекорд: волна ${save.best}</span></div>
    <div class="stack"><span class="label">Начать с волны</span>
      <div class="waves" id="cps">${cps.map(w => `<button data-w="${w}" class="${w === chosenStart ? 'on' : ''}">${w}</button>`).join('')}</div>
      <span class="muted">Контрольные точки открываются каждые 10 пройденных волн.</span></div>
    <button class="btn big" id="mPlay">▶ В бой</button>
    <div class="row2"><button class="btn ghost" id="mCamp">⚒ Лагерь</button><button class="btn ghost" id="mSound">${save.sound ? 'Звук: вкл' : 'Звук: выкл'}</button></div>
    <button class="btn ghost" id="mFx">Эффекты: ${save.fx === 'low' ? 'экономные' : 'полные'}</button>
    <details id="test" ${testOpen ? 'open' : ''}><summary>Панель тестировщика</summary><div class="stack">
      <span class="muted">Старт с волны открытия любого врага (без проверки рекорда):</span>
      <div class="waves" id="tw">${testWaves.map(w => `<button data-w="${w}" class="${w === chosenStart ? 'on' : ''}">${w}</button>`).join('')}</div>
      <div class="row2"><button class="btn ghost" id="tCoins">Монеты ×10</button><button class="btn ghost" id="tReset">${resetArm ? 'Точно сбросить?' : 'Сбросить прогресс'}</button></div>
      <span class="muted">Сохранение: схема v${save.v}, браузер этого устройства.</span>
    </div></details>`);
  const pick = e => { const b = e.target.closest("button[data-w]"); if (!b) return; chosenStart = +b.dataset.w; if (e.currentTarget.id === "tw") testOpen = true; menu(); };
  $('#cps').onclick = pick; $('#tw').onclick = pick;
  $('#test').ontoggle = e => testOpen = e.target.open;
  on('mPlay', () => { hintShown = save.best < 2; newRun(chosenStart); });
  on('mCamp', () => camp('menu'));
  on('mSound', () => { save.sound = !save.sound; Store.save(save); menu(); });
  on('mFx', () => { save.fx = save.fx === 'low' ? 'high' : 'low'; Store.save(save); menu(); });
  on('tCoins', () => { save.coins = Math.max(1000, save.coins * 10); Store.save(save); menu(); });
  on('tReset', () => { if (!resetArm) { resetArm = true; menu(); return; } resetArm = false; save = Store.fresh(); Store.save(save); S = Progress.stats(save.ups); chosenStart = 1; menu(); });
}

let campTab = 'character';
let buyMode = 1;
function bulk(u, l, coins) {   // сколько уровней купить и за сколько
  let n = 0, total = 0; const want = buyMode === 0 ? 1e4 : buyMode;
  while (n < want) { const c = Math.ceil(u.cost(l + n)); if (total + c > coins) break; total += c; n++; }
  if (n === 0) return { n:0, total:Math.ceil(u.cost(l)) };
  return { n, total };
}
function camp(from, tab) {
  if (state === 'play') state = 'paused';
  if (tab) campTab = tab;
  const br = UPGRADES[campTab];
  openOverlay(`
    <div class="label">Улучшения сохраняются между забегами и не имеют предела</div>
    <h2>Лагерь лучника</h2>
    <div class="stats" style="justify-content:space-between;align-items:center"><span class="stat"><i class="coin"></i>${fmt(save.coins)}</span>
      <span class="buymode" id="bm">${[[1, '×1'], [10, '×10'], [0, 'Макс']].map(([m, t]) => `<button data-m="${m}" class="${m === buyMode ? 'on' : ''}">${t}</button>`).join('')}</span></div>
    <div class="tabs" id="tabs">${Object.entries(UPGRADES).map(([k, b]) => `<button data-t="${k}" class="${k === campTab ? 'on' : ''}">${b.title}</button>`).join('')}</div>
    <div>${br.items.map(u => { const l = save.ups[u.id], b = bulk(u, l, save.coins), next = l + Math.max(1, b.n);
      return `<div class="up"><div><b>${u.name}</b><span class="lv">ур. ${l}</span></div>
        <div class="d">${u.fx(l)}<br>→ <b style="color:#1f2a44">${u.fx(next)}</b></div>
        <button class="btn" data-u="${u.id}" ${b.n ? '' : 'disabled'}>${b.n > 1 ? '+' + b.n + ' · ' : ''}<i class="coin"></i>${fmt(b.total)}</button></div>`; }).join('')}</div>
    <button class="btn big" id="cBack">${from === 'menu' ? '← В меню' : '▶ Вернуться в бой'}</button>`);
  $('#tabs').onclick = e => { const b = e.target.closest('button[data-t]'); if (b) { campTab = b.dataset.t; camp(from); } };
  $('#bm').onclick = e => { const b = e.target.closest('button[data-m]'); if (b) { buyMode = +b.dataset.m; camp(from); } };
  $('#card').querySelectorAll('button[data-u]').forEach(b => b.onclick = () => {
    const u = UP[b.dataset.u], l = save.ups[u.id], r = bulk(u, l, save.coins); if (!r.n) return;
    save.coins -= r.total; save.ups[u.id] += r.n; Store.save(save); sfx('buy');
    const oldMax = S.maxHp; S = Progress.stats(save.ups); if (run) run.hp += S.maxHp - oldMax;
    const sc = $('#card').scrollTop; camp(from); $('#card').scrollTop = sc;
  });
  on('cBack', () => { if (from === 'menu') menu(); else resume(); });
}

function pause() {
  if (state !== 'play') return; state = 'paused'; drag = null;
  openOverlay(`<h2>Пауза</h2><p class="muted">Волна ${run.wave} · убито ${run.kills} · заработано <i class="coin"></i>${fmt(run.coins)}</p>
    <button class="btn big" id="pRes">▶ Продолжить</button>
    <div class="row2"><button class="btn ghost" id="pCamp">⚒ Лагерь</button><button class="btn ghost" id="pMenu">Выйти в меню</button></div>`);
  on('pRes', resume); on('pCamp', () => camp('pause')); on('pMenu', () => { Store.save(save); menu(); });
}
function resume() { closeOverlay(); state = 'play'; last = performance.now(); updateHud(true); }

function showNewEnemy(t) {
  state = 'paused';
  openOverlay(`<div class="label">Волна ${t.unlock} · новый противник</div>
    <div class="enemy-card"><img class="big" src="${portrait(t.id)}" alt="${t.name}" width="84" height="84"><div class="stack" style="gap:4px"><h2>${t.name}</h2><p>${t.desc}</p></div></div>
    <p><b>Как бороться:</b> ${t.counter}</p>
    <button class="btn big" id="nOk">Понятно</button>`);
  on('nOk', resume);
}

function gameOver() {
  state = 'over'; drag = null; save.best = Math.max(save.best, run.wave - 1); Store.save(save);
  const R = run;
  openOverlay(`<div class="label">Забег окончен</div><h2>Башня пала</h2>
    <div class="stats"><span class="stat">Волна ${R.wave}</span><span class="stat">Убито ${R.kills}</span><span class="stat">+<i class="coin"></i>${fmt(R.coins)}</span></div>
    <div class="stack">
      ${R.continued ? '' : '<button class="btn ad" id="oCont">▶ Продолжить забег (реклама)</button>'}
      ${R.doubled || R.coins <= 0 ? '' : `<button class="btn ad" id="oDouble">▶ Удвоить награду: +${fmt(R.coins)}<i class="coin"></i></button>`}
    </div>
    <div class="row2"><button class="btn" id="oCamp">⚒ Лагерь</button><button class="btn" id="oAgain">↻ Заново</button></div>
    <button class="btn ghost" id="oMenu">В меню</button>`);
  on('oCont', async () => { if (!Ads.isRewardedReady()) return; if (await Ads.showRewarded('continue')) {
    R.continued = true; R.hp = Math.ceil(S.maxHp / 2); R.enemies = R.enemies.filter(e => e.y < L.wallY - 160); R.shots = []; resume(); } });
  on('oDouble', async () => { if (await Ads.showRewarded('double_reward')) { save.coins += R.coins; R.coins *= 2; R.doubled = true; Store.save(save); gameOver(); } });
  on('oCamp', () => camp('menu'));
  on('oAgain', () => newRun(R.startWave));
  on('oMenu', menu);
}

$('#bPause').onclick = pause;
$('#bCamp').onclick = () => { if (state === 'play') camp('pause'); };
for (const id of SKILLS) $('#sk-' + id).onclick = () => castSkill(id);

/* ---------- Android: пауза при сворачивании, экран не гаснет ---------- */
document.addEventListener('visibilitychange', () => { if (document.hidden) { if (state === 'play') pause(); Store.save(save); } else requestWakeLock(); });
window.addEventListener('pagehide', () => Store.save(save));
let wakeLock = null;
async function requestWakeLock() { try { if ('wakeLock' in navigator && state === 'play') wakeLock = await navigator.wakeLock.request('screen'); } catch {} }

window.addEventListener('resize', resize);
resize(); menu(); requestAnimationFrame(frame);
/* ---------- хуки Android-обёртки (MainActivity) ---------- */
window.__onAndroidPause = () => { if (state === 'play') pause(); Store.save(save); };
window.__onAndroidBack = () => {
  if (!$('#ad').hidden) return 'handled';
  if (state === 'play') { pause(); return 'handled'; }
  if (state === 'paused') { resume(); return 'handled'; }
  if (state === 'over') { menu(); return 'handled'; }
  if (!$('#ov').hidden && $('#cBack')) { menu(); return 'handled'; }
  return 'exit';
};
window.__game = { get run() { return run; }, get state() { return state; }, update, fire, WaveGen, save: () => save };
</script>

</body></html>
