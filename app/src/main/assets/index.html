<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Башенный лучник</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f2a44">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;800;900&display=swap">
<style>
/* Layout: one portrait play-field canvas, HUD floating over the sky, parchment cards for menus. Single cartoon look by choice. */
:root{
  --ink:#1f2a44; --parch:#fbf0d6; --parch-2:#f1dfb6; --wood:#8a5a34; --wood-d:#5e3b1f;
  --gold:#f3c35f; --gold-d:#b5822f; --leaf:#4f8a3c; --danger:#c8463d; --mute:#6d6250;
  --display:'Russo One','Arial Black',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0;padding:0}
body{background:var(--ink);color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
#app{position:relative;height:100%;width:100%;overflow:hidden;background:#7cc3e3}
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--z:1}
.hud>*,.bottom .side,.farm,.hint,.card,.logo,.menu-bottom{zoom:var(--z)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--body);font-weight:900;cursor:pointer;border:0;color:var(--ink)}
[hidden]{display:none!important}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}

.hud{position:absolute;top:calc(10px + var(--sat));left:0;right:0;display:flex;gap:8px;align-items:center;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pill{background:rgba(31,42,68,.86);color:#fff6df;border:2px solid var(--gold);border-radius:999px;padding:6px 12px;
  font-weight:900;font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill.wave{font-family:var(--display);font-weight:400;letter-spacing:.02em}
.hpbox{flex:1;min-width:0;display:flex;align-items:center;gap:6px}
.hpbar{flex:1;height:12px;border-radius:8px;background:rgba(31,42,68,.6);border:2px solid #fff6df;overflow:hidden}
.hpbar i{display:block;height:100%;width:100%;background:linear-gradient(#ff8a72,var(--danger));transition:width .2s}
.hpnum{color:#fff;font-weight:900;font-size:13px;text-shadow:0 1px 2px #0008;font-variant-numeric:tabular-nums}
.iconbtn{pointer-events:auto;width:40px;height:40px;border-radius:50%;background:var(--gold);box-shadow:0 3px 0 var(--gold-d);font-size:17px;flex:none;display:grid;place-items:center;padding:0}
.hud{gap:6px}
.farm{position:absolute;top:calc(60px * var(--z) + var(--sat));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:rgba(31,42,68,.88);color:#fff6df;border:2px solid #9dff9a;border-radius:999px;padding:4px 4px 4px 14px;font-weight:900;font-size:14px;white-space:nowrap}
.farm button{background:#9dff9a;border-radius:999px;padding:6px 12px;font-size:14px}
#fade{position:absolute;inset:0;background:#0d1224;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20}
#fade.on{opacity:1}
.menu-ui{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;z-index:3;
  padding:calc(20px + var(--sat)) max(20px,env(safe-area-inset-right,0px)) calc(22px + var(--sab)) max(20px,env(safe-area-inset-left,0px));pointer-events:none}
.menu-ui button{pointer-events:auto}
.logo{display:flex;flex-direction:column;align-items:center;line-height:.95;animation:float 4s ease-in-out infinite;margin-top:4vh}
.logo span{font-family:var(--display);text-transform:uppercase;letter-spacing:.03em;color:#ffd978;
  -webkit-text-stroke:2px #4a2210;paint-order:stroke fill;text-shadow:0 4px 0 #4a2210,0 8px 22px rgba(0,0,0,.45)}
.logo .l1{font-size:clamp(30px,10vw,46px);color:#fff1c8}
.logo .l2{font-size:clamp(46px,16vw,72px)}
@keyframes float{50%{transform:translateY(-6px)}}
.menu-bottom{width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px;align-items:stretch}
.menu-stats{display:flex;justify-content:center;gap:10px;color:#fff6df;font-weight:900;font-size:15px}
.menu-stats span{background:rgba(20,24,48,.6);border-radius:999px;padding:5px 12px;font-variant-numeric:tabular-nums}
.play{display:flex;flex-direction:column;align-items:center;gap:2px;background:linear-gradient(#ffe08a,#f0a93a);border:4px solid #5e3b1f;border-radius:22px;padding:14px;
  box-shadow:0 6px 0 #5e3b1f,0 14px 30px rgba(0,0,0,.4);color:#4a2210}
.play span{font-family:var(--display);font-size:32px;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.play small{font-weight:900;font-size:14px;opacity:.85}
.play:active{transform:translateY(4px);box-shadow:0 2px 0 #5e3b1f}
.menu-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtn{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--parch);border:3px solid #5e3b1f;border-radius:16px;padding:10px;font-size:16px;box-shadow:0 4px 0 #5e3b1f}
.mbtn i{display:grid;place-items:center}
.mbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #5e3b1f}
.ver{text-align:center;color:rgba(255,246,223,.55);font-size:12px;font-weight:800}
.tgl{display:flex;justify-content:space-between;align-items:center;background:var(--parch-2);border-radius:12px;padding:12px 14px;font-size:16px}
.tgl i{width:46px;height:26px;border-radius:13px;background:#b9ab8c;position:relative;transition:background .2s}
.tgl i::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px #0004}
.tgl.on i{background:var(--leaf)}
.tgl.on i::after{transform:translateX(20px)}
.camp-head{display:flex;justify-content:space-between;align-items:center;gap:8px}

.bottom{position:absolute;left:0;right:0;bottom:calc(12px + var(--sab));display:flex;justify-content:space-between;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{display:flex;gap:8px}
.skill{pointer-events:auto;position:relative;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;padding:0;overflow:hidden;
  background:radial-gradient(circle at 35% 30%,#4a5f8a,#1f2a44);border:3px solid var(--gold);box-shadow:0 3px 0 var(--gold-d),0 4px 12px #0005}
.skill::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(rgba(10,14,28,.72) calc(var(--p,0)*1turn),transparent 0)}
.skill .cdn{position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:900;font-size:16px;z-index:1;text-shadow:0 1px 3px #000}
.skill.locked{filter:grayscale(1) brightness(.75);border-color:#9a8f7a;box-shadow:0 3px 0 #6b6252}
.skill.locked .cdn::before{content:"+";font-size:22px}
.skill.ready{animation:ready 1.6s ease-in-out infinite}
.skill.active{border-color:#fff;box-shadow:0 0 0 3px #ffd24a,0 0 18px #ffb43a}
.skill.camp{background:radial-gradient(circle at 35% 30%,#fff7e2,#f1dfb6);border-color:var(--wood);box-shadow:0 3px 0 var(--wood-d);font-size:22px;color:var(--wood-d)}
@keyframes ready{50%{box-shadow:0 3px 0 var(--gold-d),0 0 14px #ffd24a}}
.buymode{display:flex;gap:6px;align-items:center;justify-content:flex-end}
.buymode .label{margin-right:auto}
.buymode button{background:var(--parch-2);border-radius:10px;padding:6px 10px;font-size:13px}
.buymode button.on{background:var(--ink);color:var(--parch)}
.chip{pointer-events:auto;background:var(--parch);border:3px solid var(--wood);border-radius:14px;padding:9px 16px;font-size:15px;box-shadow:0 3px 0 var(--wood-d)}

.hint{position:absolute;left:0;right:0;top:calc(108px * var(--z) + var(--sat));text-align:center;color:var(--ink);font-weight:900;font-size:15px;
  text-shadow:0 1px 0 #fff9;pointer-events:none;padding:0 24px;text-wrap:balance}

.overlay{position:absolute;inset:0;background:rgba(20,28,48,.72);display:flex;align-items:center;justify-content:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:5}
.card{width:100%;max-width:460px;max-height:calc(100% / var(--z));overflow:auto;background:var(--parch);border:4px solid var(--wood);border-radius:20px;
  padding:18px;box-shadow:0 6px 0 var(--wood-d),0 20px 40px #0006;display:flex;flex-direction:column;gap:12px}
.card h1,.card h2{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;line-height:1.1}
.card h1{font-size:30px;color:var(--wood-d)}
.card h2{font-size:22px;color:var(--wood-d)}
.card p{margin:0;line-height:1.45}
.muted{color:var(--mute);font-size:14px}
.btn{background:var(--gold);border-radius:14px;padding:12px 16px;font-size:16px;box-shadow:0 3px 0 var(--gold-d)}
.btn.big{font-size:19px;padding:15px}
.btn.ghost{background:var(--parch-2);box-shadow:0 3px 0 #cbb68a}
.btn.ad{background:#7fd0a0;box-shadow:0 3px 0 #3f8a5d}
.btn:disabled{opacity:.45;cursor:default}
.btn:active:not(:disabled),.chip:active,.iconbtn:active{transform:translateY(2px);box-shadow:none}
.stack{display:flex;flex-direction:column;gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stats{display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--parch-2);border-radius:10px;padding:6px 10px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:900;color:var(--mute)}
.waves{display:flex;flex-wrap:wrap;gap:6px}
.waves button{background:var(--parch-2);border-radius:10px;padding:7px 10px;font-size:14px;font-variant-numeric:tabular-nums}
.waves button.on{background:var(--ink);color:var(--parch)}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.tabs button{background:var(--parch-2);border-radius:10px;padding:6px 2px;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button.on{background:var(--wood);color:var(--parch)}
.up{display:grid;grid-template-columns:46px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:2px dashed #dcc799}
.up .ico{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;box-shadow:inset 0 0 0 2px rgba(43,29,44,.25),0 2px 0 rgba(43,29,44,.2)}
.up .txt{min-width:0}
.up b{font-size:16px}
.up .lv{font-size:12px;color:var(--mute);font-weight:900;margin-left:4px}
.up .d{font-size:13px;color:var(--mute);line-height:1.35;margin-top:2px}
.up .btn{min-width:78px;padding:9px 10px;font-size:15px;line-height:1.15;font-variant-numeric:tabular-nums}
.enemy-card{display:flex;gap:14px;align-items:center}
.enemy-card .big.boss{background:radial-gradient(#5a3a7c,#1d1230);border-color:#3e1a6e}
.enemy-card .big{width:84px;height:84px;flex:none;background:radial-gradient(#fff8e4,#ecd8a8);border-radius:18px;border:3px solid var(--wood)}
.coin{display:inline-block;width:.95em;height:.95em;border-radius:50%;vertical-align:-.12em;margin-right:.3em;background:radial-gradient(circle at 35% 30%,#fff3a8,#f3c35f 45%,#c27f1c);box-shadow:inset 0 0 0 1.5px #8a5a14}
details{background:var(--parch-2);border-radius:12px;padding:8px 12px}
details summary{font-weight:900;cursor:pointer}
details .stack{margin-top:8px}
#ad{position:absolute;inset:0;z-index:9;background:#10141f;color:#e8ecf5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
#ad .t{font-family:var(--display);font-size:26px}
#ad .n{font-size:64px;font-family:var(--display)}
@media (prefers-reduced-motion:reduce){.hpbar i{transition:none}.skill.ready{animation:none}}
</style>

</head><body>
<div id="app">
  <canvas id="game" aria-label="Игровое поле"></canvas>
  <div class="hud" id="hud" hidden>
    <div class="pill wave" id="hWave">Волна 1</div>
    <div class="pill" id="hCoins"><i class="coin"></i>0</div>
    <div class="hpbox"><div class="hpbar"><i id="hHp"></i></div><span class="hpnum" id="hHpN">5/5</span></div>
    <button class="iconbtn" id="bHome" aria-label="В главное меню"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="#1f2a44"/></svg></button>
    <button class="iconbtn" id="bPause" aria-label="Пауза">❚❚</button>
  </div>
  <div class="farm" id="farm" hidden><span>Повтор волны</span><button id="bForward">Вперёд ▶</button></div>
  <div id="menuUI" class="menu-ui" hidden>
    <div class="logo"><span class="l1">Башенный</span><span class="l2">лучник</span></div>
    <div class="menu-bottom">
      <div class="menu-stats" id="mStats"></div>
      <button class="play" id="mPlay"><span>Играть</span><small id="mWave">Волна 1</small></button>
      <div class="menu-row"><button class="mbtn" id="mCamp"><i id="mCampIco"></i><span>Лагерь</span></button><button class="mbtn" id="mSettings"><i><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.5 3.5l2-1.6-2-3.4-2.4.8a7 7 0 0 0-1.9-1.1L15.7 4h-3.9l-.5 2.7a7 7 0 0 0-1.9 1.1l-2.4-.8-2 3.4 2 1.6a7 7 0 0 0 0 2.2l-2 1.6 2 3.4 2.4-.8a7 7 0 0 0 1.9 1.1l.5 2.7h3.9l.5-2.7a7 7 0 0 0 1.9-1.1l2.4.8 2-3.4-2-1.6a7 7 0 0 0 0-2.2z" fill="#5e3b1f"/></svg></i><span>Настройки</span></button></div>
      <div class="ver">Прототип · сборка 0.5</div>
    </div>
  </div>
  <div class="hint" id="hint" hidden>Коснись поля и веди палец к цели. Отпусти — выстрел.</div>
  <div class="bottom" id="bottom" hidden><div class="side"><button class="skill" id="sk-meteor" aria-label="Метеоритный дождь"><svg viewBox="0 0 32 32" width="26" height="26"><path d="M4 4l12 9M8 2l10 9M2 9l11 7" stroke="#ffb04a" stroke-width="3" stroke-linecap="round"/><circle cx="21" cy="20" r="8" fill="#ff7a2e" stroke="#2b1d2c" stroke-width="2"/><circle cx="18.5" cy="17.5" r="2.5" fill="#ffd25a"/></svg><span class="cdn"></span></button><button class="skill" id="sk-rage" aria-label="Быстрая перезарядка"><svg viewBox="0 0 32 32" width="26" height="26"><path d="M18 2L6 18h8l-3 12 13-17h-8z" fill="#ffd24a" stroke="#2b1d2c" stroke-width="2" stroke-linejoin="round"/></svg><span class="cdn"></span></button></div><div class="side"><button class="skill" id="sk-frost" aria-label="Ледяная буря"><svg viewBox="0 0 32 32" width="26" height="26"><g stroke="#e6f7ff" stroke-width="3" stroke-linecap="round"><path d="M16 3v26M4.7 9.5l22.6 13M4.7 22.5l22.6-13"/><path d="M12 5l4 3 4-3M12 27l4-3 4 3" fill="none"/></g><circle cx="16" cy="16" r="3" fill="#8fe3ff"/></svg><span class="cdn"></span></button><button class="skill camp" id="bCamp" aria-label="Лагерь">⚒</button></div></div>
  <div class="overlay" id="ov"><div class="card" id="card"></div></div>
  <div id="ad" hidden></div>
  <div id="fade"></div>
</div>

<script>
'use strict';
/* =====================================================================
   АРХИТЕКТУРА (как в будущем Godot-проекте):
   BAL / ENEMIES / UPGRADES — таблицы данных (→ Resource .tres)
   WaveGen   — процедурный генератор волн
   Progress  — вычисление характеристик из уровней улучшений
   Store     — локальное сохранение с версией схемы
   Ads       — адаптер рекламы (здесь заглушка, в Android → Yandex Mobile Ads)
   Game/Render/Input/UI — игровая сцена и экраны
   ===================================================================== */

/* ---------- ТАБЛИЦА БАЛАНСА ----------
   Бесконечная прогрессия. Здоровье врагов и награды растут геометрически по фазам:
   до 100-й волны награды почти поспевают за ценами (лёгкий старт), дальше рост HP
   ускоряется, а наград — замедляется, и прохождение требует всё больше прокачки.
   Бот с идеальным прицелом и оптимальной прокачкой (tools/balance_bot.js): 100-я волна ~0.75 ч,
   200-я ~1.7 ч, 250-я ~3.4 ч, 300-я ~8 ч. Дальше оценка: 500-я ~100 ч, 1000-я — сотни часов. */
const PHASES = [            // [до волны, рост HP за волну, рост награды за волну]
  [100,      1.035, 1.019],
  [250,      1.055, 1.008],
  [500,      1.042, 1.017],
  [Infinity, 1.035, 1.019],
];
function phased(w, idx) {
  let v = 1, prev = 1;
  for (const p of PHASES) { const span = Math.max(0, Math.min(w, p[0]) - prev); v *= p[idx] ** span; prev = p[0]; if (w <= p[0]) break; }
  return v;
}
const BAL = {
  tower:  { baseHp: 5 },
  arrow:  { speed: 680, baseDamage: 2, cooldown: 0.45, minCooldown: 0.12, volleyN: 5, spread: 0.13 },
  wave: {
    count:      w => Math.min(40, 6 + Math.floor(w * 0.5)),
    hp:         w => phased(w, 1),
    speed:      w => 1 + Math.min(w, 300) * 0.0025,
    interval:   w => Math.max(0.33, 1.05 - w * 0.004),
    reward:     w => phased(w, 2),
    clearBonus: w => Math.max(3, Math.round(BAL.wave.count(w) * BAL.wave.reward(w) * 0.6)),
    breakTime: 2.4,
  },
  // После 500-й волны новых врагов нет: каждые 50 волн растут способности известных
  postCap: { start: 500, every: 50, cdMult: 0.94, potencyAdd: 0.12 },
};

/* ---------- ВРАГИ: открытие на 1/3/6 (база), 10..50, далее каждые 50 до 500 ----------
   Способности — компоненты: armor, heal, split, blink, ranged, regen, phase, summon, charge, zigzag */
const ENEMIES = [
  { id:'goblin',  name:'Гоблин',   emoji:'👺', unlock:1,   hp:2,   speed:34, size:30, reward:1, dmg:1, weight:10,
    desc:'Обычный пехотинец.', counter:'Любой меткий выстрел.' },
  { id:'wolf',    name:'Волк',     emoji:'🐺', unlock:3,   hp:1.5, speed:64, size:30, reward:1, dmg:1, weight:7,
    desc:'Быстрый, но хрупкий.', counter:'Стреляй на упреждение.' },
  { id:'ogre',    name:'Огр',      emoji:'👹', unlock:6,   hp:7,   speed:21, size:40, reward:3, dmg:2, weight:4,
    desc:'Медленный и толстокожий, бьёт стену вдвое сильнее.', counter:'Урон и пробитие.' },
  { id:'knight',  name:'Рыцарь',   emoji:'🤺', unlock:10,  hp:4,   speed:28, size:34, reward:3, dmg:1, weight:5, ab:{ armor:2 },
    desc:'Серые щитки над головой: каждый поглощает одно попадание.', counter:'Залп сбивает броню сразу; стальные стрелы её игнорируют.' },
  { id:'shaman',  name:'Шаман',    emoji:'🧙', unlock:20,  hp:4,   speed:24, size:34, reward:4, dmg:1, weight:4, ab:{ heal:{ every:3.2, radius:95, pct:0.3 } },
    desc:'Зелёное кольцо — скоро вылечит соседей.', counter:'Убей его первым.' },
  { id:'slime',   name:'Слизень',  emoji:'🦠', unlock:30,  hp:5,   speed:26, size:36, reward:3, dmg:1, weight:4, ab:{ split:{ n:2 } },
    desc:'При гибели делится на двух малышей.', counter:'Взрывные стрелы и веер.' },

const Store = {
  KEY: 'tower-archer-save', SCHEMA: 3,
  fresh() { return { v:3, coins:0, best:0, wave:1, farm:false, sound:true, music:true, fx:'high', theme:'classic', ups:Object.fromEntries(ALL_UPS.map(u => [u.id, 0])) }; },
  migrate(d) {
    const f = this.fresh();
    if (!d || typeof d !== 'object') return f;
    const ups = { ...(d.ups || {}) };
    if ((d.v || 1) < 2) {
      // v1 → v2: крит и ширина веера убраны — потраченные монеты возвращаются; урон стал процентным
      let refund = 0;
      for (let l = 0; l < (ups.crit || 0); l++) refund += Math.round(18 * 1.38 ** l);
      for (let l = 0; l < (ups.fan || 0); l++) refund += Math.round(30 * 1.6 ** l);
      d.coins = (d.coins || 0) + refund; delete ups.crit; delete ups.fan;
    }
    if ((d.v || 1) < 3) { d.wave = Math.max(1, d.best || 1); d.farm = false; d.music = true; }   // v2 → v3: продолжение с текущей волны
    const out = { ...f, ...d, ups:{ ...f.ups }, v:this.SCHEMA };
    for (const k in f.ups) if (Number.isFinite(ups[k])) out.ups[k] = ups[k];
    return out;
  },
  load() { try { return this.migrate(JSON.parse(localStorage.getItem(this.KEY))); } catch { return this.fresh(); } },
  save(d) { try { localStorage.setItem(this.KEY, JSON.stringify(d)); } catch {} },
};

/* ---------- формат больших чисел: 1.2K, 3.4M, 5.6B, 7.8T, 9.1aa … ---------- */
const SUFFIX = ['', 'K', 'M', 'B', 'T'];
function fmt(n) {
  if (!Number.isFinite(n)) return '∞';
  const a = Math.abs(n);
  if (a < 10) return (Math.round(n * 10) / 10).toString();
  if (a < 1000) return Math.round(n).toString();
  const e = Math.floor(Math.log10(a) / 3);
  const s = e < SUFFIX.length ? SUFFIX[e] : String.fromCharCode(97 + Math.floor((e - 5) / 26)) + String.fromCharCode(97 + (e - 5) % 26);
  const v = n / 1000 ** e;
  return (v >= 100 ? Math.round(v) : v >= 10 ? Math.round(v * 10) / 10 : Math.round(v * 100) / 100) + s;
}

const WaveGen = {
  scale(w) {
    const B = BAL.wave, P = BAL.postCap;
    let hp = B.hp(w), speed = B.speed(w), tier = 0;
    if (w >= P.start + P.every) tier = Math.floor((w - P.start) / P.every);
    return { hp, speed, tier, cd: P.cdMult ** tier, pot: 1 + P.potencyAdd * tier, armorBonus: Math.floor(tier / 2) };
  },
  pool(w) { return ENEMIES.filter(e => e.unlock <= w); },
  newAt(w) { return ENEMIES.find(e => e.unlock === w && e.unlock >= 10) || null; },
  build(w) {
    const pool = this.pool(w), newest = pool[pool.length - 1], q = [], boss = bossFor(w);
    const fresh = ENEMIES.find(e => e.unlock === w);
    if (fresh) for (let i = 0; i < 3; i++) q.push(fresh.id);
    const weight = e => e.weight * (e === newest && w - e.unlock < 50 ? 1.6 : 1) * (e.unlock < 10 && w > 60 ? 0.5 : 1);
    const total = pool.reduce((s, e) => s + weight(e), 0), n = BAL.wave.count(w);
    while (q.length < n) {
      let r = Math.random() * total;
      for (const e of pool) { r -= weight(e); if (r <= 0) { q.push(e.id); break; } }
    }
    for (let i = q.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [q[i], q[j]] = [q[j], q[i]]; }
    if (boss) { q.length = Math.ceil(q.length * .5); q.splice(2, 0, 'BOSS'); }
    return q;
  },
};

function layout() {

  const r = app.getBoundingClientRect();
  // Поле подгоняется под любой экран: высота ~860 единиц, ширина — по пропорциям (планшеты шире)
  K = Math.max(.6, Math.min(2.4, Math.min(r.width / 420, r.height / 860)));
  let dpr = Math.min(2.5, window.devicePixelRatio || 1);
  while (r.width * r.height * dpr * dpr > 3.2e6 && dpr > 1) dpr -= .25;   // ограничение памяти на планшетах
  W = r.width / K; H = r.height / K; DPR = dpr * K;
  cvs.width = Math.round(r.width * dpr); cvs.height = Math.round(r.height * dpr);

}

/* =====================================================================
   ГРАФИКА: фон, процедурные спрайты (кеш в offscreen-канвасах)
   ===================================================================== */
const TAU = Math.PI * 2, OL = '#2b1d2c';
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rgrad(g, x, y, r, c1, c2) { const gr = g.createRadialGradient(x - r * .35, y - r * .45, r * .08, x, y, r * 1.15); gr.addColorStop(0, c1); gr.addColorStop(1, c2); return gr; }
function fs(g, fill, lw) { g.fillStyle = fill; g.fill(); if (lw) { g.lineWidth = lw; g.strokeStyle = OL; g.lineJoin = 'round'; g.stroke(); } }
function ell(g, x, y, rx, ry, fill, lw, rot = 0) { g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot, 0, TAU); fs(g, fill, lw); }
function blob(g, x, y, rx, ry, c1, c2, lw) { ell(g, x, y, rx, ry, rgrad(g, x, y, Math.max(rx, ry), c1, c2), lw); }
function poly(g, p, fill, lw) { g.beginPath(); g.moveTo(p[0], p[1]); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i], p[i + 1]); g.closePath(); fs(g, fill, lw); }
function line(g, pts, color, lw, outline) {
  const path = () => { g.beginPath(); g.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) g.lineTo(pts[i], pts[i + 1]); };

function getSprite(id, size, f, white) {
  size = Math.round(size); const key = id + '|' + size + '|' + f + (white ? 'w' : '');
  let c = spriteCache.get(key); if (c) return c;
  c = document.createElement('canvas'); const side = Math.ceil(size * 1.9 * DPR); c.width = c.height = side;
  const g = c.getContext('2d');
  if (white) { g.drawImage(getSprite(id, size, f, false), 0, 0); g.globalCompositeOperation = 'source-atop'; g.fillStyle = '#fff'; g.fillRect(0, 0, side, side); }
  else { g.translate(side / 2, side / 2); PAINT[id](g, size / 2 * DPR, f); }
  spriteCache.set(key, c); return c;
}
function blit(c, x, y, sx = 1, sy = 1) { const s = c.width / DPR; ctx.drawImage(c, x - s * sx / 2, y - s * sy / 2, s * sx, s * sy); }
function portrait(id, px = 128) {
  const c = document.createElement('canvas'); c.width = c.height = px; const g = c.getContext('2d');
  g.translate(px / 2, px / 2 + px * .04); PAINT[id](g, px * .3, 0); return c.toDataURL();
}

/* ---------- фон (рисуется один раз на размер экрана) ---------- */
let vig = null, clouds = [];
function pine(g, x, y, h, c1, c2) {
  for (let i = 0; i < 3; i++) { const yy = y - i * h * .28, w = h * (.42 - i * .1);
    g.beginPath(); g.moveTo(x, yy - h * .45); g.lineTo(x + w, yy); g.lineTo(x - w, yy); g.closePath(); g.fillStyle = c1; g.fill();
    g.beginPath(); g.moveTo(x, yy - h * .45); g.lineTo(x + w, yy); g.lineTo(x + w * .15, yy); g.closePath(); g.fillStyle = c2; g.fill(); }
  g.fillStyle = '#4a3020'; g.fillRect(x - h * .04, y, h * .08, h * .1);
}
function buildBg() {
  bg = document.createElement('canvas'); bg.width = cvs.width; bg.height = cvs.height;
  const g = bg.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); const R = rng(11), ft = L.fieldTop;
  // небо и солнце
  let gr = g.createLinearGradient(0, 0, 0, ft + 30); gr.addColorStop(0, '#6cc0ea'); gr.addColorStop(.75, '#bfe6f0'); gr.addColorStop(1, '#ffe9c4');
  g.fillStyle = gr; g.fillRect(0, 0, W, ft + 30);
  gr = g.createRadialGradient(W * .82, ft * .25, 4, W * .82, ft * .25, W * .55); gr.addColorStop(0, 'rgba(255,248,214,.95)'); gr.addColorStop(.12, 'rgba(255,236,170,.55)'); gr.addColorStop(1, 'rgba(255,236,170,0)');
  g.fillStyle = gr; g.fillRect(0, 0, W, ft + 30);
  // дальние горы со снегом
  const peaks = []; for (let x = -30; x <= W + 60; x += 55 + R() * 40) peaks.push([x, ft - 30 - R() * 40]);
  g.fillStyle = '#9ec3d8'; g.beginPath(); g.moveTo(-40, ft + 10); for (const [x, y] of peaks) g.lineTo(x, y); g.lineTo(W + 60, ft + 10); g.fill();
  g.fillStyle = 'rgba(255,255,255,.85)'; for (const [x, y] of peaks) { g.beginPath(); g.moveTo(x, y); g.lineTo(x + 12, y + 12); g.lineTo(x + 3, y + 9); g.lineTo(x - 4, y + 14); g.lineTo(x - 12, y + 11); g.closePath(); g.fill(); }
  // ближние холмы
  g.fillStyle = '#86b39a'; g.beginPath(); g.moveTo(0, ft + 10); for (let x = 0; x <= W + 30; x += 30) g.lineTo(x, ft - 8 - Math.sin(x * .02 + 1) * 10 - R() * 6); g.lineTo(W, ft + 10); g.fill();
  // поле
  gr = g.createLinearGradient(0, ft, 0, L.wallY); gr.addColorStop(0, '#a6cf72'); gr.addColorStop(.5, '#8cbf5c'); gr.addColorStop(1, '#6a9a48');
  g.fillStyle = gr; g.fillRect(0, ft, W, L.wallY - ft + 10);
  for (let i = 0; i < 14; i++) { const x = R() * W, y = ft + 30 + R() * (L.wallY - ft - 40), r = 40 + R() * 70;
    gr = g.createRadialGradient(x, y, 2, x, y, r); const light = R() < .5; gr.addColorStop(0, light ? 'rgba(230,255,170,.22)' : 'rgba(40,90,40,.14)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2); }
  // тропы
  for (const k of [0.25, 0.75]) {
    const path = () => { g.beginPath(); g.moveTo(W * k, ft); g.bezierCurveTo(W * (k + .14), ft + 170, W * (k - .12), L.wallY - 170, W / 2 + (k - .5) * 110, L.wallY); };
    g.lineCap = 'round'; path(); g.lineWidth = 34; g.strokeStyle = 'rgba(150,110,60,.35)'; g.stroke();
    path(); g.lineWidth = 24; g.strokeStyle = '#d6b77c'; g.stroke(); path(); g.lineWidth = 10; g.strokeStyle = 'rgba(255,240,200,.35)'; g.stroke();
  }
  // трава, цветы, камни
  for (let i = 0; i < 700; i++) { const x = R() * W, y = ft + 18 + R() * (L.wallY - ft - 20), d = (y - ft) / (L.wallY - ft), h = 3 + d * 6;
    g.strokeStyle = R() < .5 ? `rgba(70,120,50,${.35 + d * .3})` : `rgba(190,230,120,${.3 + d * .2})`; g.lineWidth = 1 + d;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x - 2 + R() * 4, y - h); g.stroke(); }
  const fl = ['#ffffff', '#ffe066', '#ff9ec7', '#b9a6ff'];
  for (let i = 0; i < 70; i++) { const x = R() * W, y = ft + 25 + R() * (L.wallY - ft - 35); g.fillStyle = fl[i % 4]; g.beginPath(); g.arc(x, y, 1.6 + R() * 1.4, 0, TAU); g.fill(); }
  for (let i = 0; i < 9; i++) { const x = R() * W, y = ft + 40 + R() * (L.wallY - ft - 80), r = 5 + R() * 7;
    ell(g, x, y + r * .5, r * 1.1, r * .35, 'rgba(30,50,20,.25)', 0); blob(g, x, y, r, r * .75, '#d9d4c8', '#7d776c', 1.5); }
  // кромка леса
  for (let x = -10; x < W + 20; x += 13) pine(g, x + R() * 6, ft - 2 + R() * 4, 30 + R() * 14, '#4f7f5d', '#3c6449');
  for (let x = -6; x < W + 20; x += 17) pine(g, x + R() * 8, ft + 10 + R() * 5, 34 + R() * 16, '#3f7a3f', '#2d5c31');
  gr = g.createLinearGradient(0, ft, 0, ft + 40); gr.addColorStop(0, 'rgba(20,50,25,.35)'); gr.addColorStop(1, 'rgba(20,50,25,0)'); g.fillStyle = gr; g.fillRect(0, ft + 8, W, 40);
  // земля за стеной
  gr = g.createLinearGradient(0, L.wallY, 0, H); gr.addColorStop(0, '#5e8446'); gr.addColorStop(1, '#3e5c33'); g.fillStyle = gr; g.fillRect(0, L.wallY, W, H - L.wallY);
  bgTheme = theme(); const T = THEMES[bgTheme]; T.wall(g); T.tower(g);
  // виньетка
  vig = document.createElement('canvas'); vig.width = cvs.width; vig.height = cvs.height; const v = vig.getContext('2d'); v.setTransform(DPR, 0, 0, DPR, 0, 0);
  gr = v.createRadialGradient(W / 2, H * .5, Math.min(W, H) * .45, W / 2, H * .5, Math.max(W, H) * .78); gr.addColorStop(0, 'rgba(20,20,40,0)'); gr.addColorStop(1, 'rgba(20,20,40,.38)');
  v.fillStyle = gr; v.fillRect(0, 0, W, H);
  // облака
  clouds = []; const CR = rng(5);
  for (let i = 0; i < 3; i++) { const c = document.createElement('canvas'), cw = 150, ch = 60; c.width = cw * DPR; c.height = ch * DPR; const cg = c.getContext('2d'); cg.scale(DPR, DPR);
    for (let k = 0; k < 6; k++) { const x = 25 + k * 20 + CR() * 8, y = 34 - Math.sin(k / 5 * Math.PI) * 14, r = 14 + CR() * 10;
      ell(cg, x, y + 4, r, r * .8, 'rgba(160,190,215,.55)', 0); ell(cg, x, y, r, r * .85, '#ffffff', 0); }
    clouds.push({ c, w:cw, h:ch, x:CR() * W, y:12 + i * (ft * .22), sp:6 + CR() * 6 }); }
}

/* ---------- окружение: облака, их тени, пыльца, факелы ---------- */
const motes = Array.from({ length:26 }, (_, i) => ({ x:Math.random(), y:Math.random(), p:Math.random() * TAU, s:.3 + Math.random() * .7 }));
function drawAmbientBack() {
  for (const c of clouds) { const x = ((c.x + time * c.sp) % (W + c.w)) - c.w; ctx.drawImage(c.c, x, c.y, c.w, c.h); }
}
function drawAmbientFront() {
  if (save.fx !== 'low') {
    for (let i = 0; i < 2; i++) { const x = ((i * W * .7 + time * 9) % (W + 360)) - 180, y = L.fieldTop + (L.wallY - L.fieldTop) * (.3 + i * .35);
      ctx.fillStyle = 'rgba(20,40,30,.08)'; ctx.beginPath(); ctx.ellipse(x, y, 150, 50, 0, 0, TAU); ctx.fill(); }
    ctx.globalCompositeOperation = 'lighter';
    for (const m of motes) { const x = (m.x * W + Math.sin(time * .5 + m.p) * 20 + time * 8 * m.s) % W, y = L.fieldTop + m.y * (L.wallY - L.fieldTop) + Math.sin(time * .8 + m.p) * 10;
      ctx.fillStyle = `rgba(255,240,180,${.25 + .25 * Math.sin(time * 2 + m.p)})`; ctx.beginPath(); ctx.arc(x, y, 1.6 * m.s + .6, 0, TAU); ctx.fill(); }
    ctx.globalCompositeOperation = 'source-over';
  }
  THEMES[theme()].lights();
}

/* =====================================================================
   ОБЛИКИ БАШНИ: стена, башня, свет/анимация и лучник для каждого стиля
   ===================================================================== */
// облик башни зависит от волны: 1–300 классика, 301–500 лесной форт, 501–1000 цитадель, 1001+ бастион
const THEME_BY_WAVE = [[300, 'classic'], [500, 'forest'], [1000, 'citadel'], [Infinity, 'royal']];
const themeForWave = w => THEME_BY_WAVE.find(([m]) => w <= m)[1];
const theme = () => themeForWave(run ? run.wave : save.wave);
let bgTheme = null;
function flame(g, x, y, s, fl) {
  g.fillStyle = '#ff8a2e'; g.beginPath(); g.moveTo(x - 6 * s, y); g.quadraticCurveTo(x - 7 * s, y - 10 * s * fl, x, y - 19 * s * fl); g.quadraticCurveTo(x + 7 * s, y - 10 * s * fl, x + 6 * s, y); g.fill();
  g.fillStyle = '#ffe58a'; g.beginPath(); g.moveTo(x - 3 * s, y); g.quadraticCurveTo(x - 3.5 * s, y - 6 * s * fl, x, y - 11 * s * fl); g.quadraticCurveTo(x + 3.5 * s, y - 6 * s * fl, x + 3 * s, y); g.fill();
}
function glow(x, y, r, c0, c1) { ctx.globalCompositeOperation = 'lighter'; const gr = ctx.createRadialGradient(x, y, 1, x, y, r); gr.addColorStop(0, c0); gr.addColorStop(1, c1); ctx.fillStyle = gr; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.globalCompositeOperation = 'source-over'; }
// лук: общий рисунок с разными стилями
function drawBow(g, x, y, ang, pull, recoil, st) {
  g.save(); g.translate(x, y + 2); g.rotate(ang); g.translate(-recoil * 40, 0);
  const r = st.r || 21, a0 = st.span || 1.25, tip = (s) => [4 + Math.cos(s * a0) * r, Math.sin(s * a0) * r];
  const limb = () => { g.beginPath(); g.arc(4, 0, r, -a0, a0);
    if (st.recurve) { const [ux, uy] = tip(-1), [lx, ly] = tip(1); g.moveTo(ux, uy); g.quadraticCurveTo(ux + 1, uy - 5, ux - 4, uy - 6); g.moveTo(lx, ly); g.quadraticCurveTo(lx + 1, ly + 5, lx - 4, ly + 6); } };
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.strokeStyle = OL; g.lineWidth = (st.w || 4) + 2.6; limb(); g.stroke();
  g.strokeStyle = st.wood; g.lineWidth = st.w || 4; limb(); g.stroke();
  if (st.edge) { g.strokeStyle = st.edge; g.lineWidth = 1.2; g.beginPath(); g.arc(4, 0, r + 1, -a0 + .1, a0 - .1); g.stroke(); }
  if (st.wraps) for (const k of [-.7, .7]) { g.strokeStyle = st.wraps; g.lineWidth = (st.w || 4) + .5; g.beginPath(); g.arc(4, 0, r, k - .06, k + .06); g.stroke(); }
  g.strokeStyle = st.grip; g.lineWidth = (st.w || 4) + .5; g.beginPath(); g.arc(4, 0, r, -.16, .16); g.stroke();
  const [ux, uy] = tip(-1), [lx, ly] = tip(1);
  g.strokeStyle = st.string || '#f4eedd'; g.lineWidth = 1.3; g.beginPath(); g.moveTo(ux, uy); g.lineTo(-pull, 0); g.lineTo(lx, ly); g.stroke();
  if (pull) { g.fillStyle = '#7a4a22'; g.fillRect(-pull, -1.5, r + 13, 3); g.fillStyle = st.head || '#e8e1cc'; g.beginPath(); g.moveTo(-pull + r + 17, 0); g.lineTo(-pull + r + 9, -4); g.lineTo(-pull + r + 9, 4); g.closePath(); g.fill(); g.lineWidth = 1; g.strokeStyle = OL; g.stroke(); }
  g.restore();
}

const THEMES = {
  /* ---------- КЛАССИКА ---------- */
  classic: { name:'Классика',
    wall(g) { const R = rng(41); let gr;
      for (let x = -4; x < W + 8; x += 15) { const h = 34 + (R() * 6 | 0);
        gr = g.createLinearGradient(x, 0, x + 14, 0); gr.addColorStop(0, '#c58d55'); gr.addColorStop(.6, '#9a6638'); gr.addColorStop(1, '#6e4524');
        g.beginPath(); g.moveTo(x + 1, L.wallY + 14); g.lineTo(x + 1, L.wallY - h + 22); g.lineTo(x + 7.5, L.wallY - h + 12); g.lineTo(x + 14, L.wallY - h + 22); g.lineTo(x + 14, L.wallY + 14); g.closePath();
        fs(g, gr, 2); g.strokeStyle = 'rgba(60,35,20,.35)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x + 5, L.wallY - h + 26); g.lineTo(x + 5, L.wallY + 8); g.stroke(); }
      for (const yy of [L.wallY - 12, L.wallY + 3]) { g.fillStyle = '#5a3a20'; g.fillRect(0, yy, W, 4); g.fillStyle = 'rgba(255,220,160,.25)'; g.fillRect(0, yy, W, 1); } },
    tower(g) { const tx = L.towerX, top = L.archerY + 22; let gr;
      gr = g.createLinearGradient(tx - 50, 0, tx + 50, 0); gr.addColorStop(0, '#dccbb0'); gr.addColorStop(.45, '#bba98e'); gr.addColorStop(1, '#7f6e58');
      g.beginPath(); g.moveTo(tx - 44, top); g.lineTo(tx + 44, top); g.lineTo(tx + 54, H); g.lineTo(tx - 54, H); g.closePath(); fs(g, gr, 2.5);
      for (let row = 0, y = top + 6; y < H; y += 15, row++) { const half = 44 + (y - top) / (H - top) * 10;
        for (let x = tx - half + (row % 2) * 10; x < tx + half - 6; x += 20) { const w = Math.min(18, tx + half - x - 2); g.fillStyle = 'rgba(255,245,225,.22)'; g.fillRect(x, y, w, 2); g.fillStyle = 'rgba(60,45,35,.25)'; g.fillRect(x, y + 11, w, 2); } }
      gr = g.createRadialGradient(tx, top + 62, 2, tx, top + 62, 26); gr.addColorStop(0, 'rgba(255,210,120,.55)'); gr.addColorStop(1, 'rgba(255,210,120,0)'); g.fillStyle = gr; g.fillRect(tx - 30, top + 34, 60, 60);
      g.beginPath(); g.moveTo(tx - 9, top + 76); g.lineTo(tx - 9, top + 56); g.arc(tx, top + 56, 9, Math.PI, 0); g.lineTo(tx + 9, top + 76); g.closePath(); fs(g, '#ffcf7a', 2.5);
      g.fillStyle = OL; g.fillRect(tx - 1, top + 47, 2, 29); g.fillRect(tx - 9, top + 62, 18, 2);
      gr = g.createLinearGradient(0, top - 6, 0, top + 8); gr.addColorStop(0, '#a87a4a'); gr.addColorStop(1, '#6b4426');
      poly(g, [tx - 58, top - 4, tx + 58, top - 4, tx + 52, top + 8, tx - 52, top + 8], gr, 2.5);
      for (let i = -2; i <= 2; i++) { const bx = tx + i * 22; gr = g.createLinearGradient(bx - 8, 0, bx + 8, 0); gr.addColorStop(0, '#d8c7ab'); gr.addColorStop(1, '#8c7a62');
        poly(g, [bx - 8, top - 4, bx - 8, top - 22, bx + 8, top - 22, bx + 8, top - 4], gr, 2); }
      for (const s of [-1, 1]) { const bx = tx + s * 40, by = top + 10;
        poly(g, [bx - 9, by, bx + 9, by, bx + 9, by + 42, bx, by + 34, bx - 9, by + 42], rgrad(g, bx, by + 18, 30, '#e8524a', '#8e1f22'), 2);
        g.fillStyle = '#f3c35f'; g.fillRect(bx - 9, by, 18, 3); poly(g, [bx, by + 10, bx + 5, by + 18, bx, by + 26, bx - 5, by + 18], '#f3c35f', 0); } },
    lights() { const top = L.archerY + 22;
      for (const s of [-1, 1]) { const x = L.towerX + s * 60, y = top - 12, fl = .85 + Math.sin(time * 17 + s) * .08 + Math.sin(time * 31) * .05;
        ctx.fillStyle = '#5a3a20'; ctx.fillRect(x - 2, y, 4, 16); glow(x, y - 4, 34 * fl, 'rgba(255,190,90,.55)', 'rgba(255,140,40,0)'); flame(ctx, x, y, .8, fl); } },
    archer(g, x, y, face, ang, pull, recoil) {
      poly(g, [x - 13, y - 2, x + 13, y - 2, x + 19, y + 26, x - 19, y + 26], rgrad(g, x, y + 10, 24, '#3f8a4c', '#1f4a2a'), 2.2);
      poly(g, [x - face * 16, y - 18, x - face * 9, y - 20, x - face * 4, y + 8, x - face * 11, y + 9], '#8a5a2c', 1.8);
      for (let i = 0; i < 3; i++) poly(g, [x - face * (15 - i * 3), y - 19 - i, x - face * (12 - i * 3), y - 25 - i, x - face * (9 - i * 3), y - 20 - i], '#e04f45', 1);
      ell(g, x, y + 6, 10, 12, rgrad(g, x, y + 6, 12, '#7cc46a', '#3b7a3a'), 2);
      g.fillStyle = '#6b4426'; g.fillRect(x - 10, y + 10, 20, 3);
      ell(g, x, y - 9, 10, 10, rgrad(g, x, y - 9, 10, '#5fae5c', '#28603a'), 2.2);
      ell(g, x + face * 2, y - 7, 6.5, 6, '#f5cfa6', 0); ell(g, x + face * 4.5, y - 8, 1.3, 1.6, OL, 0);
      poly(g, [x - face * 6, y - 17, x - face * 15, y - 4, x - face * 7, y - 9], '#28603a', 1.5);
      drawBow(g, x, y, ang, pull, recoil, { wood:'#a8703a', grip:'#f3c35f' }); },
  },

  /* ---------- ЦИТАДЕЛЬ: круглая каменная башня, плющ, жаровни, вымпел ---------- */
  citadel: { name:'Цитадель',
    wall(g) { const R = rng(52), top = L.wallY - 24; let gr;
      gr = g.createLinearGradient(0, top, 0, H); gr.addColorStop(0, '#cbbfa9'); gr.addColorStop(.25, '#a89b85'); gr.addColorStop(1, '#6f6455');

        const v = R() * 26 - 13; g.fillStyle = `rgba(${v > 0 ? '255,250,235' : '50,40,30'},${Math.abs(v) / 100})`; g.fillRect(x + 1, y + 1, 24, 11);
        g.strokeStyle = 'rgba(55,45,35,.4)'; g.lineWidth = 1.1; g.strokeRect(x + .5, y + .5, 25, 12); g.fillStyle = 'rgba(255,250,235,.25)'; g.fillRect(x + 1, y + 1, 24, 1.5); }
      for (let x = -8; x < W + 10; x += 30) { gr = g.createLinearGradient(x, 0, x + 18, 0); gr.addColorStop(0, '#ddd2bd'); gr.addColorStop(1, '#93877a');
        poly(g, [x, top + 1, x, top - 16, x + 18, top - 16, x + 18, top + 1], gr, 2); g.fillStyle = 'rgba(255,255,240,.35)'; g.fillRect(x + 1, top - 15, 16, 2); }
      g.strokeStyle = OL; g.lineWidth = 2; g.beginPath(); g.moveTo(0, top + 1); g.lineTo(W, top + 1); g.stroke();
      g.fillStyle = 'rgba(30,25,20,.25)'; g.fillRect(0, top + 2, W, 5);
      for (let x = 40; x < W; x += 92) { if (Math.abs(x - L.towerX) < 70) continue; poly(g, [x - 3, top + 30, x - 3, top + 14, x, top + 11, x + 3, top + 14, x + 3, top + 30], '#2a2230', 1.4); }
      for (let i = 0; i < 26; i++) { const x = R() * W, y = top + (R() < .5 ? 2 : 18 + R() * 30); ell(g, x, y, 4 + R() * 6, 2.5 + R() * 2.5, R() < .5 ? '#6f9a48' : '#86b05a', 0); } },
    tower(g) { const tx = L.towerX, top = L.archerY + 22, R = rng(53); let gr;

      gr = g.createLinearGradient(tx - 60, 0, tx + 60, 0); gr.addColorStop(0, '#9d917e'); gr.addColorStop(.28, '#eadfca'); gr.addColorStop(.55, '#c2b59f'); gr.addColorStop(.85, '#837765'); gr.addColorStop(1, '#5f5546');
      g.beginPath(); g.moveTo(tx - half(top), top + 8); g.lineTo(tx + half(top), top + 8); g.lineTo(tx + half(H), H); g.lineTo(tx - half(H), H); g.closePath(); fs(g, gr, 2.6);
      for (let row = 0, y = top + 24; y < H; y += 14, row++) { const h = half(y);

/* ---------- ЗВУК: синтезатор на Web Audio. Все звуки и музыка генерируются кодом, файлов нет ---------- */
const Snd = {
  ctx:null, master:null, sfxBus:null, musBus:null, rev:null, noise:null, last:{},

    try {
      const C = new (window.AudioContext || window.webkitAudioContext)(); this.ctx = C;
      const comp = C.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 3; comp.connect(C.destination);
      // общий срез гула ниже 70 Гц и мягкий срез верхов
      const hp = C.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 70;
      const lp = C.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 9000;
      this.master = C.createGain(); this.master.gain.value = .85; this.master.connect(hp); hp.connect(lp); lp.connect(comp);
      // эффекты: мягкий срез верхов, чтобы ничего не резало слух
      const slp = C.createBiquadFilter(); slp.type = 'lowpass'; slp.frequency.value = 5500; slp.Q.value = .5;
      this.sfxBus = C.createGain(); this.sfxBus.connect(slp); slp.connect(this.master);
      // у музыки дополнительно убираем низ ниже 140 Гц — никакого гудящего баса
      const mhp = C.createBiquadFilter(); mhp.type = 'highpass'; mhp.frequency.value = 140; mhp.Q.value = .5;
      this.musBus = C.createGain(); this.musBus.connect(mhp); mhp.connect(this.master);
      this.setVolumes(true);
      const len = C.sampleRate * 2.2 | 0, ir = C.createBuffer(2, len, C.sampleRate);
      for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2.5; }
      this.rev = C.createConvolver(); this.rev.buffer = ir; const rg = C.createGain(); rg.gain.value = .28; this.rev.connect(rg).connect(this.master);
      const nb = C.createBuffer(1, C.sampleRate, C.sampleRate), nd = nb.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1; this.noise = nb;
      return true;
    } catch { return false; }
  },
  setVolumes(now) {
    if (!this.ctx) return; const t = this.ctx.currentTime, quiet = state === 'paused' || state === 'over';
    const s = save.sound ? .6 : 0, m = save.music ? (quiet ? .14 : .36) : 0;
    if (now) { this.sfxBus.gain.value = s; this.musBus.gain.value = m; }
    else { this.sfxBus.gain.setTargetAtTime(s, t, .05); this.musBus.gain.setTargetAtTime(m, t, .4); }
  },
  ok() { return this.ctx && this.ctx.state === 'running'; },
  env(g, t, vol, at, dur) { g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + at); g.gain.exponentialRampToValueAtTime(.0001, t + dur); },
  out(node, dest, wet) { node.connect(dest || this.sfxBus); if (wet) { const w = this.ctx.createGain(); w.gain.value = wet; node.connect(w); w.connect(this.rev); } },
  tone({ type = 'sine', f, dur, vol = .2, at = .005, delay = 0, lp, hp, q = .7, vib, dest, wet = 0 }) {
    const C = this.ctx, t = C.currentTime + Math.max(0, delay), o = C.createOscillator(), g = C.createGain(), fs = Array.isArray(f) ? f : [f];

    if (vib) { const l = C.createOscillator(), lg = C.createGain(); l.frequency.value = vib[0]; lg.gain.value = vib[1]; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t + dur + .05); }

  },
  hiss({ dur, vol = .2, at = .003, delay = 0, type = 'bandpass', f = 1000, f1, q = 1, dest, wet = 0 }) {

  harp(f, { vol = .1, delay = 0, dur = 1.4, dest, wet = .3 } = {}) {

/* ---------- МУЗЫКА: генеративный секвенсор (ре дорийский) — арфа, флейта, мягкий фон, рамочный барабан в бою ---------- */
const Music = {
  timer:null, next:0, step:0, mode:'menu', mel:7,
  BOSS_BARS:[[62, 65, 69], [58, 62, 65], [60, 64, 67], [57, 61, 64], [62, 65, 69], [58, 62, 65], [55, 58, 62], [57, 61, 64]],
  BARS:[[62, 65, 69], [60, 64, 67], [55, 59, 62], [62, 65, 69], [62, 65, 69], [60, 64, 67], [57, 60, 64], [62, 65, 69]],
  SCALE:[74, 76, 77, 79, 81, 83, 84, 86, 88, 89, 91, 93],
  setMode(m) { this.mode = m; },
  start() {
    if (!Snd.ctx || this.timer) return;
    this.next = Snd.ctx.currentTime + .15; this.step = 0;
    this.timer = setInterval(() => this.tick(), 60);
  },
  tick() {
    const C = Snd.ctx; if (!C || C.state !== 'running' || !save.music) { if (C) this.next = Math.max(this.next, C.currentTime + .05); return; }
    const bpm = this.mode === 'boss' ? 112 : this.mode === 'battle' ? 100 : 76, eighth = 60 / bpm / 2;
    if (this.next < C.currentTime) this.next = C.currentTime + .05;
    while (this.next < C.currentTime + .3) { this.play(this.step, this.next, eighth); this.next += eighth; this.step++; }
  },
  play(step, t, e) {
    const D = Snd.musBus, battle = this.mode !== 'menu', s = step % 8, bar = Math.floor(step / 8) % 8, ch = (this.mode === 'boss' ? this.BOSS_BARS : this.BARS)[bar];
    const at = t - Snd.ctx.currentTime;
    // мягкий фон-аккорд (пэд) раз в такт: синусы средних частот с медленной атакой
    if (s === 0) for (const n of ch) Snd.tone({ f:mtof(n), dur:e * 8.4, vol:.022, at:e * 2, delay:at, dest:D, wet:.5 });
    // арфа: арпеджио по аккорду
    const arp = [ch[0], ch[1], ch[2], ch[0] + 12, ch[2], ch[1], ch[0] + 12, ch[2]];
    if (battle || Math.random() > .2) Snd.harp(mtof(arp[s]), { vol:battle ? .055 : .05, delay:at, dest:D, dur:1.2, wet:.35 });
    // флейта: чистый тон с дыханием и вибрато
    if (s % 2 === 0 && Math.random() < (battle ? .55 : .45) && (bar % 2 === 1 || battle)) {
      this.mel = Math.max(0, Math.min(this.SCALE.length - 1, this.mel + [-2, -1, -1, 1, 1, 2][Math.random() * 6 | 0]));
      let n = this.SCALE[this.mel];
      if (s === 0) { const tones = ch.map(c => c + 12).concat(ch.map(c => c + 24)); n = tones.reduce((a, b) => Math.abs(b - n) < Math.abs(a - n) ? b : a); }
      Snd.tone({ f:mtof(n), dur:e * 1.9, vol:.032, at:.06, vib:[5, 3], delay:at, dest:D, wet:.45 });
      Snd.hiss({ dur:e * 1.2, vol:.006, f:mtof(n) * 2, q:4, at:.05, delay:at, dest:D });
    }
    // рамочный барабан и бубен — только в бою, тихо
    if (battle) {
      if (s === 0 || s === 4) { Snd.tone({ f:[220, 150], dur:.16, vol:.07, delay:at, dest:D }); Snd.hiss({ dur:.07, vol:.04, f:500, q:.8, delay:at, dest:D }); }
      if (s % 2 === 1) Snd.hiss({ dur:.04, vol:s === 3 || s === 7 ? .022 : .012, type:'highpass', f:8000, delay:at, dest:D });
    }
  },
};
function audioUnlock() { if (Snd.init()) { Music.start(); Snd.setVolumes(); } }
document.addEventListener('pointerdown', audioUnlock, { capture:true });

/* ---------- прослушивание звуков (настройки → панель тестировщика) ---------- */
const SFX_NAMES = { shoot:'Выстрел', volley:'Залп', hit:'Попадание', block:'Броня', kill:'Гибель врага', coin:'Монета', hurt:'Удар по башне', wave:'Начало волны',
  clear:'Волна отбита', buy:'Покупка', meteorCast:'Метеоры', boom:'Взрыв метеора', rage:'Быстрая перезарядка', frost:'Ледяная буря', defeat:'Поражение' };
function soundBoard() {

/* ---------- обновление ---------- */

      smoke(e.x, e.y + 10, 8, '120,80,160'); voice(e.t.id, true); ring(e.x, e.y + 10, 'rgba(200,120,255,.9)', 6, 50, .4, 4); } }

function settings() {
  const testWaves = [1, 10, 20, 40, 60, 80, 100, 150, 200, 301, 400, 501, 750, 1001];
  openOverlay(`<h2>Настройки</h2>
    <div class="stack">${toggle('sSound', 'Звуки', save.sound)}${toggle('sMusic', 'Музыка', save.music)}${toggle('sFx', 'Полные эффекты', save.fx !== 'low')}</div>
    <details id="test" ${testOpen ? 'open' : ''}><summary>Панель тестировщика</summary><div class="stack">
      <span class="muted">Текущая волна (20/40/60/80/100 — боссы; 301, 501, 1001 — новые облики):</span>
      <div class="waves" id="tw">${testWaves.map(w => `<button data-w="${w}" class="${w === save.wave ? 'on' : ''}">${w}</button>`).join('')}</div>
      <div class="row2"><button class="btn ghost" id="tCoins">Монеты ×10</button><button class="btn ghost" id="tReset">${resetArm ? 'Точно сбросить?' : 'Сбросить прогресс'}</button></div>
      <button class="btn ghost" id="tSounds">Прослушать звуки</button>
      <span class="muted">Сохранение: схема v${save.v}, память этого устройства.</span>
    </div></details>
    <button class="btn big" id="sBack">Готово</button>`);
  const flip = (k, fn) => () => { fn(); Store.save(save); Snd.setVolumes(); settings(); };
  on('sSound', flip('s', () => save.sound = !save.sound));
  on('sMusic', flip('m', () => save.music = !save.music));
  on('sFx', flip('f', () => save.fx = save.fx === 'low' ? 'high' : 'low'));
  $('#test').ontoggle = e => testOpen = e.target.open;
  $('#tw').onclick = e => { const b = e.target.closest('button[data-w]'); if (!b) return; save.wave = +b.dataset.w; save.farm = false; Store.save(save); settings(); };
  on('tCoins', () => { save.coins = Math.max(1000, save.coins * 10); Store.save(save); settings(); });
  on('tReset', () => { if (!resetArm) { resetArm = true; settings(); return; } resetArm = false; save = Store.fresh(); Store.save(save); S = Progress.stats(save.ups); settings(); });
  on('tSounds', soundBoard);
  on('sBack', () => { resetArm = false; showMenu(); });
}

let campTab = 'character', buyMode = 1;
function bulk(u, l, coins) {   // сколько уровней купить и за сколько
  let n = 0, total = 0; const want = buyMode === 0 ? 1e4 : buyMode;
  while (n < want) { const c = Math.ceil(u.cost(l + n)); if (total + c > coins) break; total += c; n++; }
  if (n === 0) return { n:0, total:Math.ceil(u.cost(l)) };
  return { n, total };
}
function camp(from, tab) {
  if (state === 'play') state = 'paused';
  if (tab) campTab = tab;
  const br = UPGRADES[campTab];
  openOverlay(`
    <div class="camp-head"><h2>Лагерь лучника</h2><span class="stat"><i class="coin"></i>${fmt(save.coins)}</span></div>
    <div class="tabs" id="tabs">${Object.entries(UPGRADES).map(([k, b]) => `<button data-t="${k}" class="${k === campTab ? 'on' : ''}">${icon(BRANCH_ICON[k], 22)}<span>${b.title}</span></button>`).join('')}</div>
    <div class="buymode" id="bm"><span class="label">Покупать</span>${[[1, '×1'], [10, '×10'], [0, 'Макс']].map(([m, t]) => `<button data-m="${m}" class="${m === buyMode ? 'on' : ''}">${t}</button>`).join('')}</div>
    <div>${br.items.map(u => { const l = save.ups[u.id], b = bulk(u, l, save.coins), next = l + Math.max(1, b.n);
      return `<div class="up"><div class="ico" style="background:${BRANCH_TINT[campTab]}">${icon(u.id, 34)}</div>
        <div class="txt"><div><b>${u.name}</b><span class="lv">ур. ${l}</span></div>
        <div class="d">${u.fx(l)}<br>→ <b style="color:#1f2a44">${u.fx(next)}</b></div></div>
        <button class="btn" data-u="${u.id}" ${b.n ? '' : 'disabled'}>${b.n > 1 ? '+' + b.n + '<br>' : ''}<i class="coin"></i>${fmt(b.total)}</button></div>`; }).join('')}</div>
    <button class="btn big" id="cBack">${from === 'menu' ? '← В меню' : from === 'over' ? '← Назад' : '▶ Вернуться в бой'}</button>`);
  $('#tabs').onclick = e => { const b = e.target.closest('button[data-t]'); if (b) { sfx('click'); campTab = b.dataset.t; camp(from); } };
  $('#bm').onclick = e => { const b = e.target.closest('button[data-m]'); if (b) { sfx('click'); buyMode = +b.dataset.m; camp(from); } };
  $('#card').querySelectorAll('button[data-u]').forEach(b => b.onclick = () => {
    const u = UP[b.dataset.u], l = save.ups[u.id], r = bulk(u, l, save.coins); if (!r.n) return;
    save.coins -= r.total; save.ups[u.id] += r.n; Store.save(save); sfx('buy');
    const oldMax = S.maxHp; S = Progress.stats(save.ups); if (run && state !== 'over') run.hp += S.maxHp - oldMax;
    const sc = $('#card').scrollTop; camp(from); $('#card').scrollTop = sc;
  });
  on('cBack', () => { if (from === 'menu') showMenu(); else if (from === 'over') defeat(true); else resume(); });
}

function pause() {
  if (state !== 'play') return; state = 'paused'; drag = null;
  openOverlay(`<h2>Пауза</h2><p class="muted">Волна ${run.wave}${save.farm ? ' (повтор)' : ''} · убито ${run.kills} · заработано <i class="coin"></i>${fmt(run.coins)}</p>
    <button class="btn big" id="pRes">▶ Продолжить</button>
    <div class="row2"><button class="btn ghost" id="pCamp">⚒ Лагерь</button><button class="btn ghost" id="pMenu">⌂ В главное меню</button></div>
    ${save.farm ? '<button class="btn ghost" id="pFwd">Выключить повтор: идти вперёд</button>' : ''}`);
  on('pRes', resume); on('pCamp', () => camp('pause')); on('pMenu', () => confirmExit('pause'));
  on('pFwd', () => { forward(); resume(); });
}
function confirmExit(from) {
  if (state === 'play') { state = 'paused'; drag = null; }
  openOverlay(`<h2>Точно выйти в главное меню?</h2>
    <p class="muted">Монеты и улучшения сохранены. Волна ${run ? run.wave : save.wave} начнётся заново, когда вернёшься.</p>
    <div class="row2"><button class="btn ghost" id="xStay">Остаться</button><button class="btn" id="xGo">Выйти</button></div>`);
  on('xGo', () => { Store.save(save); go(showMenu); });
  on('xStay', () => { if (from === 'pause') { state = 'play'; pause(); } else resume(); });
}
function resume() { closeOverlay(); state = 'play'; last = performance.now(); updateHud(true); Snd.setVolumes(); }
function forward() { save.farm = false; Store.save(save); updateHud(true); if (run) floatText(W / 2, H * .4, 'Вперёд!', '#ffe9a0', 22); }

function showThemeCard(k) {
  state = 'paused'; buildBg();
  openOverlay(`<div class="label">Волна ${run.wave} · новый облик</div><h2>${THEMES[k].name}</h2>
    <p>Башня, стена и лучник преобразились. Враги здесь крепче — не забывай про Лагерь.</p>
    <button class="btn big" id="nOk">Вперёд</button>`);
  sfx('clear'); on('nOk', resume);
}
function showNewEnemy(t) {
  state = 'paused';
  openOverlay(`<div class="label">Волна ${t.unlock} · новый противник</div>
    <div class="enemy-card"><img class="big" src="${portrait(t.id)}" alt="${t.name}" width="84" height="84"><div class="stack" style="gap:4px"><h2>${t.name}</h2><p>${t.desc}</p></div></div>
    <p><b>Как бороться:</b> ${t.counter}</p>
    <button class="btn big" id="nOk">Понятно</button>`);
  voice(t.id, true);
  on('nOk', resume);
}

function gameOver() { defeat(false); }
function defeat(again) {
  state = 'over'; drag = null; Store.save(save);
  if (!again) { sfx('defeat'); buzz(120); }
  const R = run, w = R.wave, prev = Math.max(1, w - 1);
  openOverlay(`<div class="label">Волна ${w}${save.farm ? ' · повтор' : ''}</div><h2>Враги прорвались</h2>
    <p class="muted">Волна начнётся заново с полной башней. Если не хватает силы, вернись на волну назад и накопи монет: она будет повторяться, пока не нажмёшь «Вперёд».</p>
    <div class="stats"><span class="stat">Убито ${R.kills}</span><span class="stat">+<i class="coin"></i>${fmt(R.coins)}</span></div>
    <button class="btn big" id="oAgain">↻ Начать волну ${w} заново</button>
    ${w > 1 ? `<button class="btn ghost" id="oBack">← Вернуться на волну ${prev}</button>` : ''}
    ${R.continued ? '' : '<button class="btn ad" id="oCont">▶ Продолжить бой с половиной ❤ (реклама)</button>'}
    <div class="row2"><button class="btn ghost" id="oCamp">⚒ Лагерь</button><button class="btn ghost" id="oMenu">⌂ В меню</button></div>`);
  on('oAgain', () => newRun(w));
  on('oBack', () => { save.farm = true; newRun(prev); });
  on('oCont', async () => { if (!Ads.isRewardedReady()) return; if (await Ads.showRewarded('continue')) {
    R.continued = true; R.hp = Math.ceil(S.maxHp / 2); R.enemies = R.enemies.filter(e => e.y < L.wallY - 160); R.shots = []; resume(); } });
  on('oCamp', () => camp('over'));
  on('oMenu', () => go(showMenu));
}

$('#bPause').onclick = () => { sfx('click'); pause(); };
$('#bHome').onclick = () => { sfx('click'); confirmExit('play'); };
$('#bCamp').onclick = () => { if (state === 'play') { sfx('click'); camp('pause'); } };
$('#bForward').onclick = () => { sfx('click'); forward(); };
$('#mPlay').onclick = () => { audioUnlock(); sfx('wave'); go(startGame); };
$('#mCamp').onclick = () => { sfx('click'); camp('menu'); };
$('#mSettings').onclick = () => { sfx('click'); settings(); };
for (const id of SKILLS) $('#sk-' + id).onclick = () => castSkill(id);
$('#mCampIco').innerHTML = icon('repair', 26);

/* ---------- Android: пауза при сворачивании, звук выключается в фоне ---------- */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { if (state === 'play') pause(); Store.save(save); try { Snd.ctx && Snd.ctx.suspend(); } catch {} }
  else { try { Snd.ctx && Snd.ctx.resume(); } catch {} requestWakeLock(); }
});
window.addEventListener('pagehide', () => Store.save(save));
let wakeLock = null;
async function requestWakeLock() { try { if ('wakeLock' in navigator && state === 'play') wakeLock = await navigator.wakeLock.request('screen'); } catch {} }

window.addEventListener('resize', () => { resize(); buildMenuBg(); });
resize(); showMenu(); requestAnimationFrame(frame);
/* ---------- хуки Android-обёртки (MainActivity) ---------- */
window.__onAndroidPause = () => { if (state === 'play') pause(); Store.save(save); try { Snd.ctx && Snd.ctx.suspend(); } catch {} };
window.__onAndroidBack = () => {
  if (!$('#ad').hidden) return 'handled';
  if (state === 'play') { pause(); return 'handled'; }
  if (state === 'paused') { resume(); return 'handled'; }
  if (state === 'over') return 'handled';
  if (state === 'menu' && !$('#ov').hidden) { showMenu(); return 'handled'; }
  return 'exit';
};
window.__game = { get run() { return run; }, get state() { return state; }, update, fire, WaveGen, save: () => save };
</script>

</body></html>
