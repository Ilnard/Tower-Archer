name: Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_KEY: ${{ secrets.UPLOAD_KEYSTORE_B64 != '' }}
      VER: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Игра в сборке — ровно файл app/src/main/assets/index.html (единый источник)
      - name: Check single source of the game
        run: python3 tools/build_web.py --check

      - name: Fetch fonts (SIL OFL) into the APK
        run: |
          F=app/src/main/assets/fonts; B=https://github.com/google/fonts/raw/main/ofl
          curl -fsSL -o $F/RussoOne-Regular.ttf "$B/russoone/RussoOne-Regular.ttf"
          curl -fsSL -o $F/OFL-RussoOne.txt "$B/russoone/OFL.txt"
          curl -fsSL -o $F/Nunito.ttf "$B/nunito/Nunito%5Bwght%5D.ttf"
          curl -fsSL -o $F/OFL-Nunito.txt "$B/nunito/OFL.txt"
          ls -la $F

      - name: Test APK (demo ads, tester panel, .dev package)
        run: gradle :app:assembleDebug --no-daemon

      - name: Decode upload key
        if: env.HAS_KEY == 'true'
        run: echo "${{ secrets.UPLOAD_KEYSTORE_B64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Release AAB + APK (signed with upload key)
        if: env.HAS_KEY == 'true'
        env:
          UPLOAD_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          YANDEX_REWARDED_ID: ${{ vars.YANDEX_REWARDED_ID }}
        run: gradle :app:bundleRelease :app:assembleRelease --no-daemon

      - name: Collect files
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk "out/TowerArcher-test-$VER.apk"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "out/TowerArcher-$VER.aab"
            cp app/build/outputs/apk/release/app-release.apk "out/TowerArcher-$VER.apk"
          fi
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: TowerArcher-${{ env.VER }}
          path: out/*

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ${{ env.VER }}
          body: |
            Сборка ${{ env.VER }} из коммита ${{ github.sha }}.
            • TowerArcher-test-*.apk — тестовая версия (отдельное приложение «Лучник (тест)», демо-реклама, панель тестировщика).
            • TowerArcher-*.aab — для загрузки в Google Play Console (появляется, когда в секретах есть ключ загрузки).
            • TowerArcher-*.apk — релизная версия для проверки на телефоне перед загрузкой.
          files: out/*
          make_latest: true
